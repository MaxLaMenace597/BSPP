  else if (a === 'edit-test'){ resultsSheet(null, b.dataset.id); }
  else if (a === 'day'){ daySheet(b.dataset.d); }
  else if (a === 'wk'){ planWeekOffset += +b.dataset.v; renderTrain(); }
  else if (a === 'sim'){ closeSheet(); simTool(); }
  else if (a === 'bip') bipTool();
  else if (a === 'killy') killyTool();
  else if (a === 'count') countTool();
  else if (a === 'save-plan'){
    const st = $('pl-start').value, ex = $('pl-exam').value;
    if (!st || !ex || ex <= st){ toast('La date des épreuves doit être après le début'); return; }
    const T = S.train; T.start = st; T.exam = ex;
    T.goals.ll = clamp(parseFloat($('pl-ll').value) || 12, 3, 20); T.goals.tr = clamp(parseInt($('pl-tr').value,10) || 30, 1, 80); T.goals.ki = clamp(parseInt($('pl-ki').value,10) || 200, 20, 900);
    _specialCache = null; planWeekOffset = null; save(); render(); toast('Plan recalculé');
  }
}
$('v-train').addEventListener('click', trainClick);

/* =========================================================
   PAGE 3 — QUIZ & FICHES
   ========================================================= */
const QS = (window.QUESTIONS || []);
const QBY = Object.fromEntries(QS.map(q => [q.id, q]));
const THEMES = window.QUIZ_THEMES || {};
const FICHES = window.FICHES || [];
const BOX_DAYS = [1,2,4,8,16,32];

function dailyIds(day){
  const Q = S.quiz;
  if (Q.days[day]) return Q.days[day].ids;
  const st = Q.st;
  const due = Object.entries(st).filter(([id,v]) => QBY[id] && v.due && v.due <= day && v.box < 3).sort((a,b) => a[1].due.localeCompare(b[1].due)).map(([id]) => id).slice(0,2);
  const rnd = rng(hash('bspp' + day));
  const themes = shuffle(Object.keys(THEMES), rnd);
  const unseen = shuffle(QS.filter(q => !st[q.id] && !due.includes(q.id)), rnd);
  const picks = [...due];
  let ti = 0, guard = 0;
  while (picks.length < 5 && unseen.length && guard++ < 500){
    const th = themes[ti++ % themes.length];
    const i = unseen.findIndex(q => q.t === th);
    if (i >= 0) picks.push(unseen.splice(i,1)[0].id);
    else if (guard > themes.length*2) picks.push(unseen.shift().id);
  }
  if (picks.length < 5){ const pool = shuffle(QS.filter(q => !picks.includes(q.id)), rnd).sort((a,b) => ((st[a.id]||{}).box||0) - ((st[b.id]||{}).box||0)); while (picks.length < 5 && pool.length) picks.push(pool.shift().id); }
  return picks;
}
function recordAnswer(id, ok){
  const st = S.quiz.st[id] || { ok:0, ko:0, box:0 };
  if (ok){ st.ok++; st.box = Math.min(st.box + 1, 5); } else { st.ko++; st.box = 0; }
  st.last = todayStr(); st.due = addD(todayStr(), ok ? BOX_DAYS[st.box] : 1);
  S.quiz.st[id] = st;
}
function quizStreak(){
  let n = 0, d = todayStr();
  if (!(S.quiz.days[d] && S.quiz.days[d].done)) d = addD(d, -1);
  while (S.quiz.days[d] && S.quiz.days[d].done){ n++; d = addD(d,-1); }
  return n;
}
function wrongIds(){ return Object.entries(S.quiz.st).filter(([id,v]) => QBY[id] && v.box === 0 && v.ko > 0).map(([id]) => id); }

function renderQuiz(){
  const sub = S.ui.qsub || 'quiz';
  const day = todayStr(), Q = S.quiz, rec = Q.days[day];
  const seen = Object.keys(Q.st).filter(id => QBY[id]).length;
  const okT = Object.values(Q.st).reduce((a,v) => a + v.ok, 0), koT = Object.values(Q.st).reduce((a,v) => a + v.ko, 0);
  const wrong = wrongIds();
  $('dot-quiz').hidden = !!(rec && rec.done);
  let h = `<div class="seg"><button class="${sub==='quiz'?'on':''}" data-sub="quiz">Quiz</button><button class="${sub==='fiches'?'on':''}" data-sub="fiches">Fiches (${FICHES.length})</button><button class="${sub==='stats'?'on':''}" data-sub="stats">Progrès</button></div>`;
  if (sub === 'quiz'){
    const doneToday = rec && rec.done;
    h += `<div class="hero"><div class="row"><div class="grow"><div class="k">Quiz du jour · 5 questions</div>
      <div class="big">${doneToday ? `${rec.score}/5` : rec && rec.ans && rec.ans.length ? `${rec.ans.length}/5 faites` : 'Prêt ?'}</div>
      <div class="sub">${quizStreak()} jour${quizStreak()>1?'s':''} de suite 🔥 · ${seen}/${QS.length} questions vues</div></div>
      <div style="font-size:46px">${doneToday ? (rec.score>=4?'🏆':rec.score>=3?'👍':'📚') : '🧠'}</div></div>
      <button class="btn white block" style="margin-top:14px;position:relative;z-index:1" data-act="daily">${doneToday ? 'Revoir les réponses' : rec && rec.ans && rec.ans.length ? 'Continuer' : 'Commencer le quiz du jour'}</button></div>`;
    h += `<div class="sec-title"><h3>S'entraîner par thème</h3><span>10 questions</span></div><div class="card"><div class="chips">${Object.entries(THEMES).map(([k,v]) => `<button class="chip" data-act="theme" data-t="${k}">${v.e} ${esc(v.n)}</button>`).join('')}<button class="chip" data-act="theme" data-t="*">🎲 Tout mélangé</button></div></div>`;
    h += `<div class="card"><div class="row"><div class="grow"><b>Revoir mes erreurs</b><div class="muted small">${wrong.length ? `${wrong.length} question${wrong.length>1?'s':''} à retravailler` : 'Aucune erreur en attente 👌'}</div></div><button class="btn sm ${wrong.length?'primary':''}" data-act="wrong" ${wrong.length?'':'disabled style="opacity:.5"'}>Réviser</button></div></div>`;
    h += `<div class="note"><b>Comment ça marche :</b> chaque jour, 5 questions nouvelles mélangées entre les thèmes, plus tes erreurs récentes qui reviennent (répétition espacée). En faisant le quiz tous les jours jusqu'aux épreuves, tu passes sur environ ${Math.min(QS.length, 5*Math.max(1,dd(day,S.train.exam)))} questions.</div>`;
  } else if (sub === 'fiches'){
    const byT = {};
    FICHES.forEach(f => (byT[f.t] = byT[f.t] || []).push(f));
    const readN = FICHES.filter(f => Q.read[f.id]).length;
    h += `<div class="card"><div class="row"><div class="grow"><b>${readN}/${FICHES.length} fiches lues</b><div class="muted small">Lis une fiche, puis fais le quiz du thème pour ancrer.</div></div></div><div class="bar"><div style="width:${FICHES.length?readN/FICHES.length*100:0}%"></div></div></div>`;
    for (const [t, list] of Object.entries(byT)){
      const th = THEMES[t] || {n:t, e:'📄'};
      h += `<div class="faint small" style="margin:16px 4px 6px;font-weight:700;text-transform:uppercase;letter-spacing:.06em">${th.e} ${esc(th.n)}</div><div class="card tight">${list.map(f => `<button class="fiche" data-act="fiche" data-id="${f.id}"><div class="em">${f.e||th.e}</div><div class="grow"><b>${esc(f.n)}</b>${Q.read[f.id]?' <span class="tag ok">lue</span>':''}<div class="muted small">${esc(f.s||'')}</div></div>${ICON_CHEV}</button>`).join('')}</div>`;
    }
  } else {
    const tot = okT + koT;
    h += `<div class="kpis"><div class="kpi"><b>${tot ? Math.round(okT/tot*100) : 0}%</b><span>bonnes réponses</span></div><div class="kpi"><b>${seen}</b><span>questions vues</span></div><div class="kpi"><b>${quizStreak()}🔥</b><span>jours de suite</span></div></div>`;
    h += `<div class="sec-title"><h3>Par thème</h3><span>maîtrisées / total</span></div><div class="card tight">`;
    for (const [k,v] of Object.entries(THEMES)){
      const ids = QS.filter(q => q.t === k).map(q => q.id);
      const mast = ids.filter(id => (Q.st[id]||{}).box >= 2).length;
      const sn = ids.filter(id => Q.st[id]).length;
      h += `<div class="tbar"><span style="width:26px">${v.e}</span><div class="grow"><div class="row" style="justify-content:space-between"><b class="small">${esc(v.n)}</b><span class="faint small">${mast}/${ids.length}</span></div><div class="bar" style="margin-top:5px"><div style="width:${ids.length?sn/ids.length*100:0}%;opacity:.35;position:absolute;height:100%"></div><div style="width:${ids.length?mast/ids.length*100:0}%;position:relative"></div></div></div></div>`;
    }
    h += `</div><p class="faint small" style="text-align:center">Une question est « maîtrisée » quand tu l'as réussie au moins 2 fois de suite.</p>`;
    const hist = Object.entries(Q.days).filter(([,v]) => v.done).sort().slice(-14);
    if (hist.length) h += `<div class="sec-title"><h3>14 derniers quiz</h3></div><div class="card"><div style="display:flex;align-items:flex-end;gap:5px;height:90px">${hist.map(([d,v]) => `<div style="flex:1;text-align:center"><div style="height:${v.score/5*70+4}px;background:${v.score>=4?'var(--ok)':v.score>=3?'var(--accent-2)':'var(--accent)'};border-radius:6px 6px 3px 3px"></div><div class="faint" style="font-size:10px;margin-top:3px">${pd(d).getDate()}</div></div>`).join('')}</div></div>`;
  }
  $('v-quiz').innerHTML = h;
}

/* ---- Lecteur de quiz ---- */
function runQuiz(ids, { title='Quiz', daily=false } = {}){
  const day = todayStr();
  let rec = daily ? (S.quiz.days[day] = S.quiz.days[day] || { ids, ans:[], score:0, done:false }) : { ids, ans:[], score:0 };
  let i = daily ? rec.ans.length : 0;
  if (daily && rec.done) return showResults();
  openOv(title, '');
  function show(){
    if (i >= ids.length) return showResults();
    const q = QBY[ids[i]]; if (!q){ i++; return show(); }
    const order = shuffle(q.c.map((c,k) => ({c,k})));
    const th = THEMES[q.t] || {n:q.t,e:''};
    $('ov-extra').textContent = `${i+1} / ${ids.length}`;
    $('ov-body').innerHTML = `<div class="prog"><div style="width:${i/ids.length*100}%"></div></div>
      <span class="tag red qtheme">${th.e} ${esc(th.n)}</span>
      <div class="qtext">${esc(q.q)}</div>
      <div id="qz-c">${order.map(o => `<button class="choice" data-k="${o.k}">${esc(o.c)}</button>`).join('')}</div>
      <div id="qz-e"></div>`;
    $('ov-body').scrollTop = 0;
    $('qz-c').onclick = e => {
      const b = e.target.closest('.choice'); if (!b || $('qz-c').dataset.done) return;
      $('qz-c').dataset.done = 1;
      const ok = +b.dataset.k === 0;
      $('qz-c').querySelectorAll('.choice').forEach(x => { const k = +x.dataset.k; if (k === 0) x.classList.add('good'); else if (x === b) x.classList.add('bad'); else x.classList.add('dimmed'); });
      recordAnswer(q.id, ok);
      rec.ans.push(ok ? 1 : 0); rec.score = rec.ans.reduce((a,v)=>a+v,0);
      if (daily && rec.ans.length >= ids.length) rec.done = true;
      save(); vibrate(ok ? 25 : [60,40,60]);
      $('qz-e').innerHTML = `<div class="expl"><b class="${ok?'g':'b'}">${ok ? 'Bonne réponse ✔' : 'Raté ✗'}</b> ${q.e ? esc(q.e) : ''}${!ok ? `<div style="margin-top:6px">Réponse : <b>${esc(q.c[0])}</b></div>` : ''}</div>
        <button class="btn primary block" id="qz-n" style="margin-top:14px;height:52px">${i+1 < ids.length ? 'Question suivante' : 'Voir mon score'}</button>`;
      $('qz-n').onclick = () => { i++; show(); };
      $('qz-n').scrollIntoView({ behavior:'smooth', block:'nearest' });
    };
  }
  function showResults(){
    if (!$('ov').classList.contains('on')) openOv(title, '');
    const sc = rec.ans.reduce((a,v)=>a+v,0);
    $('ov-extra').textContent = '';
    $('ov-body').innerHTML = `<div style="text-align:center;margin:10px 0 6px;font-size:54px">${sc === ids.length ? '🏆' : sc/ids.length >= .6 ? '👍' : '📚'}</div>
      <h2 style="text-align:center;font-size:30px">${sc} / ${ids.length}</h2>
      <p class="muted" style="text-align:center">${sc === ids.length ? 'Sans faute, chapeau !' : sc/ids.length >= .6 ? 'Bien joué. Les erreurs reviendront dans les prochains jours.' : 'Les erreurs reviendront dans les prochains jours : c\'est comme ça qu\'on retient.'}</p>
      <div class="card res-list">${ids.map((id,k) => { const q = QBY[id]; if (!q) return ''; const ok = rec.ans[k]; return `<div class="rq"><div>${ok ? '✅' : ok === 0 ? '❌' : '•'} <b>${esc(q.q)}</b></div><div class="muted" style="margin-top:3px">→ ${esc(q.c[0])}</div>${q.e?`<div class="faint small" style="margin-top:3px">${esc(q.e)}</div>`:''}</div>`; }).join('')}</div>
      <button class="btn primary block" id="qz-close" style="height:50px">Fermer</button>`;
    $('qz-close').onclick = closeOv;
  }
  show();
}
function themeQuiz(t){
  const pool = QS.filter(q => t === '*' || q.t === t);
  const st = S.quiz.st;
  const sorted = shuffle(pool).sort((a,b) => { const sa = st[a.id], sb = st[b.id]; const va = sa ? 1 + sa.box : 0, vb = sb ? 1 + sb.box : 0; return va - vb; });
  const ids = shuffle(sorted.slice(0, 10)).map(q => q.id);
  runQuiz(ids, { title: t === '*' ? 'Tout mélangé' : THEMES[t].n });
}
function openFiche(id){
  const f = FICHES.find(x => x.id === id); if (!f) return;
  S.quiz.read[id] = true; save();
  const th = THEMES[f.t] || {n:'',e:''};
  openOv(f.n, `<span class="tag red">${th.e} ${esc(th.n)}</span><div class="fiche-body">${f.h}</div>
    <button class="btn primary block" id="fc-q" style="margin-top:18px;height:50px">Quiz « ${esc(th.n)} » (10 questions)</button>`);
  $('fc-q').onclick = () => themeQuiz(f.t);
}
$('v-quiz').addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-sub]'); if (!b) return;
  if (b.dataset.sub){ S.ui.qsub = b.dataset.sub; save(); renderQuiz(); window.scrollTo({top:0}); return; }
  const a = b.dataset.act;
  if (a === 'daily'){ const day = todayStr(); const ids = dailyIds(day); runQuiz(ids, { title:'Quiz du jour', daily:true }); }
  else if (a === 'theme') themeQuiz(b.dataset.t);
  else if (a === 'wrong'){ const ids = shuffle(wrongIds()).slice(0,10); if (ids.length) runQuiz(ids, { title:'Mes erreurs' }); }
  else if (a === 'fiche') openFiche(b.dataset.id);
});

/* =========================================================
   Réglages
   ========================================================= */
$('btn-settings').addEventListener('click', () => {
  openSheet(`<h3>Réglages</h3>
    <div class="field"><label>Thème</label><div class="seg" id="st-th" style="margin:0">${[['auto','Auto'],['light','Clair'],['dark','Sombre']].map(([k,n]) => `<button data-v="${k}" class="${S.prefs.theme===k?'on':''}">${n}</button>`).join('')}</div></div>
    <div class="field"><label>Sauvegarde</label><div class="btns"><button class="btn" id="st-exp">Exporter mes données</button><button class="btn" id="st-imp">Importer</button></div><input type="file" id="st-file" accept="application/json,.json" hidden></div>
    <p class="faint small">Tes données restent sur ce téléphone. Exporte-les de temps en temps (ou avant de changer de téléphone).</p>
    <div class="hr"></div>
    <button class="btn block" id="st-reset" style="color:var(--accent)">Tout effacer et recommencer</button>
    <p class="faint small" style="margin-top:14px">Objectif BSPP · ${QS.length} questions · ${FICHES.length} fiches</p>`, el => {
      el.querySelector('#st-th').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; S.prefs.theme = b.dataset.v; save(); applyTheme(); el.querySelectorAll('#st-th button').forEach(x => x.classList.toggle('on', x === b)); };
      el.querySelector('#st-exp').onclick = () => {
        const blob = new Blob([JSON.stringify(S, null, 1)], { type:'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `objectif-bspp-${todayStr()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      };
      el.querySelector('#st-imp').onclick = () => el.querySelector('#st-file').click();
      el.querySelector('#st-file').onchange = ev => {
        const f = ev.target.files[0]; if (!f) return;
        const r = new FileReader(); r.onload = () => { try{ const s = JSON.parse(r.result); if (!s || s.v !== 1) throw 0; localStorage.setItem(LS, JSON.stringify(s)); load(); _specialCache = null; applyTheme(); closeSheet(); render(); toast('Données importées'); }catch(e){ toast('Fichier invalide'); } }; r.readAsText(f);
      };
      const rs = el.querySelector('#st-reset');
      rs.onclick = () => { if (rs.dataset.c){ S = freshState(); _specialCache = null; save(); applyTheme(); closeSheet(); render(); toast('Tout est remis à zéro'); } else { rs.dataset.c = 1; rs.textContent = 'Appuie encore pour confirmer'; } };
    });
});

/* =========================================================
   Navigation + rendu
   ========================================================= */
function setTab(t){
  S.ui.tab = t; save();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + t));
  $('hdr-sub').textContent = { dossier:'Mon dossier de candidature', train:'Préparation physique', quiz:'Culture pompier de Paris' }[t];
  render(); window.scrollTo({ top:0 });
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
function render(){
  renderDossier(); renderTrain(); renderQuiz();
}
let lastDay = todayStr();
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayStr() !== lastDay){ lastDay = todayStr(); planWeekOffset = null; render(); } });
setTab(S.ui.tab || 'dossier');

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
