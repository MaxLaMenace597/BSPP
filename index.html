/* =========================================================
   DÉFI MORT SUBITE (15 s par question, une erreur et c'est fini)
   ========================================================= */
function runSurvival(){
  const PER = 15; let streak = 0, raf = 0, t0 = 0, over = false;
  const used = new Set();
  openOv('Mort subite', '', () => cancelAnimationFrame(raf));
  const next = () => {
    const pool = QS.filter(q => !used.has(q.id)); const q = pool[Math.floor(Math.random()*pool.length)]; used.add(q.id);
    const th = THEMES[q.t] || {n:q.t, e:''}, order = shuffle(q.c.map((c,k) => ({c,k})));
    $('ov-extra').textContent = `🔥 ${streak}`;
    $('ov-body').innerHTML = `<div class="prog"><div id="sv-bar" style="width:100%;transition:none"></div></div>
      <span class="tag red qtheme">${th.e} ${esc(th.n)}</span><div class="qtext">${esc(q.q)}</div>
      <div id="sv-c">${order.map(o => `<button class="choice" data-k="${o.k}">${esc(o.c)}</button>`).join('')}</div>`;
    t0 = performance.now(); over = false;
    const tick = () => { if (over) return; const left = PER - (performance.now()-t0)/1000; $('sv-bar').style.width = clamp(left/PER,0,1)*100 + '%'; if (left <= 0){ lose(q, null); return; } raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    $('sv-c').onclick = e => { const b = e.target.closest('.choice'); if (!b || over) return; const ok = +b.dataset.k === 0; recordAnswer(q.id, ok); save();
      if (ok){ over = true; cancelAnimationFrame(raf); streak++; vibrate(20); b.classList.add('good'); setTimeout(next, 350); }
      else lose(q, b); };
  };
  const lose = (q, b) => {
    over = true; cancelAnimationFrame(raf); beepEnd();
    if (b) b.classList.add('bad');
    const prev = S.quiz.survie || 0, rec = streak > prev; if (rec) S.quiz.survie = streak; save();
    $('ov-extra').textContent = '';
    setTimeout(() => {
      $('ov-body').innerHTML = `<div style="text-align:center;font-size:54px;margin-top:16px">${rec ? '🏆' : '💥'}</div><div class="note20">${streak}</div>
        <p style="text-align:center;font-weight:700">${rec ? 'Nouveau record !' : `Record : ${prev}`}</p>
        <div class="card"><div class="muted small">${b ? 'Raté sur' : 'Temps écoulé sur'} :</div><b>${esc(q.q)}</b><div style="color:var(--ok);margin-top:4px">→ ${esc(q.c[0])}</div>${q.e ? `<div class="faint small" style="margin-top:4px">${esc(q.e)}</div>` : ''}</div>
        <div class="btns"><button class="btn" id="sv-x">Fermer</button><button class="btn primary" id="sv-again">Rejouer</button></div>`;
      $('sv-again').onclick = runSurvival; $('sv-x').onclick = closeOv;
    }, b ? 700 : 100);
  };
  next();
}

    <button class="btn primary block" data-x="ok">Créer le fichier agenda</button>`, el => {

        const T = S.train, t = todayStr();
        const icsEsc = x => String(x).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
        const fold = line => { const out = []; let s = line; while (s.length > 60){ out.push(s.slice(0,60)); s = ' ' + s.slice(60); } out.push(s); return out.join('\r\n'); };
        const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
        const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Objectif BSPP//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Objectif BSPP'];
        let n = 0;
        for (let s = t; s <= T.exam; s = addD(s,1)){
          const x = buildSession(s);
          if (!['train','test','exam'].includes(x.kind)) continue;
          if (sessionStatus(s).st === 'ok') continue; // déjà faite
          if (dayType(s) === 'foot') continue; // le foot est déjà dans ton agenda
          const d = s.replace(/-/g,'');
          const start = `${d}T${pad(hh)}${pad(mm)}00`;
          const durMin = x.kind === 'train' ? 60 : 90;
          const desc = x.blocks.filter(b => b.cls === 'main').map(b => b.h + ' : ' + b.items.join(' / ')).join('\n') + '\n\nDétail à jour dans l\'appli Objectif BSPP.';
          lines.push('BEGIN:VEVENT', `UID:bspp-${d}@objectif-bspp`, `DTSTAMP:${stamp}`, `DTSTART:${start}`, `DURATION:PT${durMin}M`,
            fold(`SUMMARY:${icsEsc((x.kind === 'exam' ? '🔥 ' : x.kind === 'test' ? '⏱️ ' : '💪 ') + 'BSPP · ' + x.title)}`), fold(`DESCRIPTION:${icsEsc(desc)}`));
          if (rem) lines.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc('Séance : ' + x.title)}`,`TRIGGER:-PT${rem}M`,'END:VALARM');
          lines.push('END:VEVENT'); n++;
        }
        lines.push('END:VCALENDAR');
        const blob = new Blob([lines.join('\r\n')], { type:'text/calendar;charset=utf-8' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'objectif-bspp-seances.ics'; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        closeSheet(); toast(`${n} séances exportées dans le fichier agenda`);
      };
    });
}

// Étapes d'une séance de course
const RS = {
  warm: (d=600) => ({ k:'warm', d, t:'Échauffement', sub:'Footing très lent, gammes, 3 accélérations' }),
  // Échauffement guidé : footing, gammes, 3 accélérations, 1 min pour se préparer
  warmup(V){
    const st = [
      { k:'warm', d:600, t:'ÉCHAUFFEMENT', sub:'Footing très lent : tu dois pouvoir parler', kmh: V ? +(V*0.6).toFixed(1) : null, grp:'warm' },
      { k:'warm', d:180, t:'GAMMES', sub:'Montées de genoux, talons-fesses, pas chassés (2 × 20 m chacun)', grp:'warm' }
    ];
    for (let i=1; i<=3; i++){
      st.push({ k:'acc', d:15, t:'ACCÉLÉRATION', sub:`Accélération progressive ${i}/3 (environ 60 m)`, grp:'warm' });
      st.push({ k:'warm', d:i < 3 ? 45 : 60, t: i < 3 ? 'MARCHE' : 'PRÉPARE-TOI', sub: i < 3 ? 'Reviens en marchant ou en trottinant' : "C'est bientôt parti !", grp:'warm' });
    }
    return st;
  },
  cool: (d=300) => ({ k:'cool', d, t:'Retour au calme', sub:'Trot ou marche, puis étirements' }),
  steady: (d, kmh, t='Footing', sub='Allure conversation') => ({ k:'steady', d, t, sub, kmh }),
  intervals({ sets=1, reps, on, off, between=180, kmhOn, kmhOff=null }){
    const st = [];
    for (let s=1; s<=sets; s++){
      for (let r=1; r<=reps; r++){
        st.push({ k:'on', d:on, t:'VITE', kmh:kmhOn, dist: r5(kmhOn/3.6*on), set:s, sets, rep:r, reps });
        if (r < reps) st.push({ k:'off', d:off, t: off >= 60 ? 'RÉCUP' : 'TROT', kmh:kmhOff, set:s, sets, rep:r, reps, sub: off >= 60 ? 'Trottine doucement' : 'Trottine' });
      }
      if (s < sets) st.push({ k:'rest', d:between, t:'PAUSE', sub:`Trot léger, puis série ${s+1}` });
    }
    return st;
  }
};

/* =========================================================
   ABSENCES JUSTIFIÉES & REPRISE PROGRESSIVE
   ========================================================= */
const ABS_R = { operation:{ n:'Opération', e:'🏥' }, blessure:{ n:'Blessure', e:'🤕' }, maladie:{ n:'Maladie', e:'🤒' }, autre:{ n:'Autre empêchement', e:'📅' } };
const absences = () => S.train.absences || [];
const absenceOn = s => absences().find(a => a.from <= s && s <= a.to) || null;
const repriseLen = a => { const len = dd(a.from, a.to) + 1; return len < 3 ? 0 : Math.min(21, Math.max(4, len)); };
// Reprise après une absence d'au moins 3 jours : volume de 55 % à 95 %, charges un peu plus légères
function repriseInfo(s){
  let best = null;
  for (const a of absences()){
    if (a.to >= s) continue;
    const R = repriseLen(a); if (!R) continue;
    const k = dd(a.to, s);
    if (k >= 1 && k <= R){ const p = (k-1)/R; const c = { a, R, k, p, f: 0.55 + 0.4*p }; if (!best || c.f < best.f) best = c; }
  }
  return best;
}
// Si plus de la moitié des séances des 14 derniers jours ont été manquées (sans justification), on allège un peu
function complianceFactor(s){
  const t = todayStr(), end = s < t ? s : t, first = specialDays().first;
  let planned = 0, done = 0;
  for (let d = addD(end, -14); d < end; d = addD(d, 1)){
    if (d < first || d < S.train.start || isRest(d) || absenceOn(d)) continue;
    planned++;
    const lg = S.train.log[d]; if ((lg && lg.done) || S.train.tests.some(x => x.date === d)) done++;
  }
  return planned >= 4 && done/planned < 0.5 ? 0.85 : 1;
}
// Semaines d'entraînement « effectives » : seulement les séances faites (passé) ou prévues (futur)
function effWeeks(from, s){
  const t = todayStr(), wk = S.train.week || WEEK_FOOT;
  const perWeek = Math.max(1, Object.values(wk).filter(x => x !== 'rest').length);
  let n = 0;
  for (let d = addD(from, 1); d < s; d = addD(d, 1)){
    if (isRest(d) || absenceOn(d)) continue;
    if (d < t){ const lg = S.train.log[d]; if ((lg && lg.done) || S.train.tests.some(x => x.date === d)) n++; }
    else n++;
  }
  return n / perWeek;
}

    <div class="btns">${ex ? '<button class="btn" data-x="del" style="color:var(--accent)">Supprimer</button>' : ''}<button class="btn primary" data-x="ok">Enregistrer</button></div>`, el => {
      el.querySelector('#ab-r').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; reason = b.dataset.v; el.querySelectorAll('#ab-r .chip').forEach(x => x.classList.toggle('on', x === b)); };

/* =========================================================
   SÉANCE GUIDÉE (tractions, chaise, gainage, jambes…)
   ========================================================= */
const EX = {
  timer: (name, d, note='', ico='⏱️', extra={}) => ({ type:'timer', name, d, note, ico, ...extra }),
  reps: (name, sets, reps, rest, note='', ico='💪', extra={}) => ({ type:'reps', name, sets, reps, rest, note, ico, ...extra }),
  hold: (name, sets, hold, rest, note='', ico='🪑', extra={}) => ({ type:'hold', name, sets, hold, rest, note, ico, ...extra }),
  emom: (name, min, reps, note='') => ({ type:'emom', name, min, reps, note, ico:'⏲️', tr:true }),
  pyramid: (name, top) => ({ type:'list', name, tr:true, ico:'🔺', note:'Récup = 10 s × le nombre de tractions que tu viens de faire',
    list:[...Array.from({length:top}, (_, i) => i+1), ...Array.from({length:top-1}, (_, i) => top-1-i)], restPer:10 }),
  ladder: (name, top, count=3, between=120) => { const list = [], rests = []; for (let c=0; c<count; c++) for (let r=1; r<=top; r++){ list.push(r); rests.push(r === top ? between : Math.max(15, r*10)); } return { type:'list', name, list, rests, tr:true, ico:'🪜', note:`${count} échelles de 1 à ${top} tractions` }; },
  max: (name, rest, note='') => ({ type:'max', name, rest, note, ico:'🔥', tr:true }),
  backoff: (name, total, per, rest) => ({ type:'backoff', name, total, per, rest, ico:'💪', tr:true })
};
function woSteps(wo){
  const q = [];
  wo.forEach((ex, xi) => {
    const last = xi === wo.length - 1;
    const after = last ? 0 : (ex.restAfter != null ? ex.restAfter : Math.min(ex.rest || 60, 90));
    if (ex.type === 'timer') q.push({ k:'timer', ex, d:ex.d });
    else if (ex.type === 'reps' || ex.type === 'hold'){
      for (let i=1; i<=ex.sets; i++){
        q.push({ k: ex.type === 'reps' ? 'set' : 'hold', ex, set:i, sets:ex.sets, reps:ex.reps, d:ex.hold });
        const r = i < ex.sets ? ex.rest : after; if (r) q.push({ k:'rest', ex, d:r });
      }
    } else if (ex.type === 'emom'){ q.push({ k:'emom', ex, min:ex.min, reps:ex.reps }); if (after) q.push({ k:'rest', ex, d:after }); }
    else if (ex.type === 'list'){
      ex.list.forEach((n, i) => { q.push({ k:'set', ex, set:i+1, sets:ex.list.length, reps:n }); const r = i < ex.list.length - 1 ? (ex.rests ? ex.rests[i] : n*ex.restPer) : after; if (r) q.push({ k:'rest', ex, d:r }); });
    } else if (ex.type === 'max'){ q.push({ k:'max', ex }); q.push({ k:'rest', ex, d:ex.rest }); }
    else if (ex.type === 'backoff') q.push({ k:'backoff', ex, after });
  });
  return q;
}
function workoutTool(wo, ds, title){
  const q = woSteps(wo);
  let i = -1, iv = 0, t0 = 0, dur = 0, running = false, lastMax = null, lastBeep = -1, val = 0;
  const log = [];
  const cleanup = () => { clearInterval(iv); releaseWake(); try{ speechSynthesis.cancel(); }catch(e){} };
  openOv(title || 'Séance guidée', '', cleanup);
  audio(); keepAwake();
  const nRealSteps = () => q.filter(x => x.k !== 'rest').length;
  const nDone = () => q.slice(0, Math.max(0, i)).filter(x => x.k !== 'rest').length;
  const label = x => !x ? 'Fin de la séance' : x.k === 'set' ? `${x.ex.name} · ${x.reps}${x.sets > 1 ? ` (série ${x.set}/${x.sets})` : ''}` : x.k === 'hold' ? `${x.ex.name} · ${fmtSec(x.d)}${x.sets > 1 ? ` (${x.set}/${x.sets})` : ''}` : x.k === 'emom' ? `EMOM ${x.min} min · ${x.reps} par minute` : x.k === 'timer' ? `${x.ex.name} · ${fmtSec(x.d)}` : x.ex.name;
  const nextReal = from => { for (let j = from; j < q.length; j++) if (q[j].k !== 'rest') return q[j]; return null; };
  const spoken = s => s.replace(/ min/g, ' minutes').replace(/ s\b/g, ' secondes');
  const head = st => `<div class="prog" style="height:6px;margin-top:0"><div style="width:${nDone()/Math.max(1, nRealSteps())*100}%"></div></div>
    <div class="row" style="gap:10px;margin:12px 0 4px"><div style="font-size:30px">${st.ex.ico || '💪'}</div><div class="grow"><div class="faint small" style="font-weight:700;text-transform:uppercase;letter-spacing:.06em">${st.k === 'rest' ? 'Repos' : st.sets > 1 ? `Série ${st.set} / ${st.sets}` : st.k === 'emom' ? 'EMOM' : st.k === 'timer' ? 'Étape' : 'Exercice'}</div><h3 style="font-size:20px;line-height:1.2">${esc(st.k === 'rest' ? 'Récupère' : st.ex.name)}</h3></div></div>`;
  const stop = () => { clearInterval(iv); running = false; };
  const next = () => { stop(); i++; lastBeep = -1; if (i >= q.length) return finish(); if (q[i].k === 'backoff'){ expand(); } if (i >= q.length) return finish(); show(true); };
  const expand = () => {
    const st = q[i], m = lastMax || 0, rem = Math.max(0, st.ex.total - m), n = Math.ceil(rem / Math.max(1, st.ex.per)), add = [];
    for (let k=1; k<=n; k++){ const r = k < n ? st.ex.per : rem - st.ex.per*(n-1); add.push({ k:'set', ex:st.ex, set:k, sets:n, reps:r }); const rr = k < n ? st.ex.rest : st.after; if (rr) add.push({ k:'rest', ex:st.ex, d:rr }); }
    q.splice(i, 1, ...add);
    if (n) toast(`Encore ${rem} tractions pour atteindre ${st.ex.total} au total`);
  };
  const countdown = (d, onTick, onEnd, beepEvery) => {
    stop(); running = true; t0 = performance.now(); dur = d;
    iv = setInterval(() => {
      const el = (performance.now() - t0)/1000, left = dur - el;
      onTick(el, left);
      const c = Math.ceil(left); if (c <= 3 && c >= 1 && c !== lastBeep){ lastBeep = c; beep(760,.07); }
      if (beepEvery && Math.floor(el / beepEvery) > Math.floor((el - 0.2) / beepEvery) && left > 3) beep(880,.06);
      if (left <= 0){ stop(); onEnd(); }
    }, 200);
  };
  function show(announce){
    const st = q[i], body = $('ov-body');
    $('ov-extra').textContent = `${nDone()+1}/${nRealSteps()}`;
    const after = `<div class="faint small" style="text-align:center;margin-top:10px">Ensuite : ${esc(label(nextReal(i+1)))}</div>`;
    if (st.k === 'timer'){
      body.innerHTML = head(st) + `${st.ex.note ? `<p class="muted">${esc(st.ex.note)}</p>` : ''}<div class="timer" id="wo-t">${fmtClock(st.d)}</div><div class="prog"><div id="wo-b" style="width:0"></div></div>
        <div class="btns"><button class="btn primary" id="wo-go" style="height:56px">Démarrer</button><button class="btn" id="wo-skip" style="height:56px">Passer ⏭</button></div>` + after;
      if (announce) say(spoken(`${st.ex.name}, ${fmtSec(st.d)}`));
      $('wo-skip').onclick = next;
      $('wo-go').onclick = () => { if (running){ stop(); $('wo-go').textContent = 'Reprendre'; dur = Math.max(0, dur - (performance.now()-t0)/1000); return; }
        const d0 = $('wo-go').textContent === 'Reprendre' ? dur : st.d; $('wo-go').textContent = 'Pause';
        countdown(d0, (el, left) => { $('wo-t').textContent = fmtClock(Math.ceil(left)); $('wo-b').style.width = clamp(1 - left/st.d, 0, 1)*100 + '%'; }, () => { beepPalier(); next(); }); };
    }
    else if (st.k === 'set'){
      val = st.reps;
      body.innerHTML = head(st) + `<div style="text-align:center;margin:10px 0 2px"><div class="faint small" style="font-weight:700">OBJECTIF</div><div class="note20" style="margin:0">${st.reps}</div><div class="muted">répétition${st.reps > 1 ? 's' : ''}</div></div>
        ${st.ex.note ? `<p class="faint small" style="text-align:center">${esc(st.ex.note)}</p>` : ''}
        <div class="row" style="justify-content:center;gap:14px;margin:12px 0"><button class="btn" id="wo-m" style="width:56px;font-size:22px">−</button><div style="text-align:center"><div class="faint small">j'en ai fait</div><b id="wo-v" style="font:800 30px 'Bricolage Grotesque',sans-serif">${val}</b></div><button class="btn" id="wo-p" style="width:56px;font-size:22px">+</button></div>
        <button class="btn primary block" id="wo-ok" style="height:60px;font-size:18px">Série faite ✓</button>
        <button class="btn ghost block" id="wo-skip" style="margin-top:6px">Passer cette série</button>` + after;
      if (announce) say(`${st.sets > 1 ? `Série ${st.set} sur ${st.sets}. ` : ''}${st.reps} ${st.ex.tr ? (st.reps > 1 ? 'tractions' : 'traction') : 'répétitions'}`);
      $('wo-m').onclick = () => { val = Math.max(0, val-1); $('wo-v').textContent = val; };
      $('wo-p').onclick = () => { val++; $('wo-v').textContent = val; };
      $('wo-ok').onclick = () => { log.push({ ex:st.ex, reps:val, target:st.reps }); vibrate(30); next(); };
      $('wo-skip').onclick = next;
    }
    else if (st.k === 'max'){
      let n = 0;
      body.innerHTML = head(st) + `<p class="muted" style="text-align:center">${esc(st.ex.note || tractionRule)}</p><div class="lbl">Tape sur le cercle à chaque traction valide</div><button class="counter" id="wo-c">0</button>
        <div class="btns"><button class="btn" id="wo-m">−1</button><button class="btn primary" id="wo-f">Terminé</button></div>` + after;
      if (announce) say('Série maximum. Donne tout !');
      $('wo-c').onclick = () => { n++; $('wo-c').textContent = n; beep(990,.05); vibrate(20); };
      $('wo-m').onclick = () => { n = Math.max(0, n-1); $('wo-c').textContent = n; };
      $('wo-f').onclick = () => { lastMax = n; log.push({ ex:st.ex, reps:n, max:true }); say(`${n} tractions, bravo`); next(); };
    }
    else if (st.k === 'hold'){
      body.innerHTML = head(st) + `${st.ex.note ? `<p class="muted" style="text-align:center">${esc(st.ex.note)}</p>` : ''}<div class="lbl">Tiens</div><div class="timer" id="wo-t">${fmtClock(st.d)}</div><div class="prog"><div id="wo-b" style="width:0"></div></div>
        <button class="btn primary block" id="wo-go" style="height:60px;font-size:18px">Démarrer</button>
        <button class="btn ghost block" id="wo-skip" style="margin-top:6px">Passer</button>` + after;
      if (announce) say(spoken(`${st.ex.name}, ${fmtSec(st.d)}${st.sets > 1 ? `, série ${st.set} sur ${st.sets}` : ''}`));
      $('wo-skip').onclick = next;
      $('wo-go').onclick = () => {
        if (running){ const held = Math.round((performance.now()-t0)/1000); stop(); log.push({ ex:st.ex, hold:held, target:st.d }); beepEnd(); next(); return; }
        $('wo-go').textContent = "J'ai lâché"; beep(880,.15);
        countdown(st.d, (el, left) => { $('wo-t').textContent = fmtClock(Math.ceil(left)); $('wo-b').style.width = clamp(el/st.d, 0, 1)*100 + '%'; }, () => { log.push({ ex:st.ex, hold:st.d, target:st.d }); beepPalier(); say('Terminé'); next(); }, 15);
      };
    }
    else if (st.k === 'emom'){
      body.innerHTML = head(st) + `<p class="muted" style="text-align:center">Au bip, fais <b>${st.reps} tractions</b>, puis repos jusqu'à la minute suivante.</p><div class="timer" id="wo-t">1:00</div>
        <div class="bigstat"><div><b id="wo-r">0/${st.min}</b><span>minute</span></div><div><b id="wo-d">0</b><span>tractions faites</span></div><div><b>${st.min*st.reps}</b><span>objectif</span></div></div>
        <button class="btn primary block" id="wo-go" style="height:60px;font-size:18px">Démarrer l'EMOM</button>` + after;
      if (announce) say(`EMOM ${st.min} minutes, ${st.reps} tractions par minute`);
      $('wo-go').onclick = () => {
        if (running){ stop(); const m = Math.min(st.min, Math.floor((performance.now()-t0)/60000) + 1); log.push({ ex:st.ex, reps:m*st.reps }); next(); return; }
        $('wo-go').textContent = 'Arrêter'; let lastMin = -1; stop(); running = true; t0 = performance.now();
        iv = setInterval(() => {
          const s = (performance.now()-t0)/1000, m = Math.floor(s/60);
          if (m >= st.min){ stop(); log.push({ ex:st.ex, reps:st.min*st.reps }); beepEnd(); say('EMOM terminé'); next(); return; }
          if (m !== lastMin){ lastMin = m; beepPalier(); say(`Minute ${m+1}. ${st.reps} tractions`); }
          const left = 60 - (s - m*60); $('wo-t').textContent = fmtClock(Math.ceil(left));
          const c = Math.ceil(left); if (c <= 3 && c >= 1 && c !== lastBeep){ lastBeep = c; beep(760,.07); }
          $('wo-r').textContent = `${m+1}/${st.min}`; $('wo-d').textContent = (m+1)*st.reps;
        }, 200);
      };
    }
    else if (st.k === 'rest'){
      const nx = nextReal(i+1);

        <div class="card" style="text-align:center"><div class="faint small" style="font-weight:700">ENSUITE</div><b>${esc(label(nx))}</b></div>
        <div class="btns"><button class="btn" id="wo-plus">+30 s</button><button class="btn primary" id="wo-skip">Passer la récup</button></div>`;
      if (announce) say(spoken(`Repos, ${fmtSec(st.d)}`));
      const total = () => dur;
      countdown(st.d, (el, left) => { $('wo-t').textContent = fmtClock(Math.ceil(left)); $('wo-b').style.width = clamp(el/total(), 0, 1)*100 + '%'; }, () => { beepPalier(); next(); });

      $('wo-skip').onclick = next;
    }
  }
  function finish(){
    stop(); releaseWake(); beepEnd(); say('Séance terminée. Bravo !');

    const holds = log.filter(l => l.hold != null);

    $('ov-extra').textContent = '';

        ${Object.entries(byName).map(([n, arr]) => `<div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--border)"><b>${esc(n)}</b><span class="small">${arr.map(fmtClock).join(' · ')}</span></div>`).join('')}
        ${Object.entries(others).map(([n, v]) => `<div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--border)"><b>${esc(n)}</b><span>${v} rép.</span></div>`).join('')}
        ${!log.length ? '<div class="muted">Aucune série enregistrée.</div>' : ''}
      </div>
      ${lastMax != null ? `<button class="btn block" id="wo-max" style="margin-bottom:8px">Enregistrer ${lastMax} tractions comme résultat du jour</button>` : ''}
      ${ds && ds <= todayStr() && !done ? `<button class="btn ok block" id="wo-val" style="height:52px">Valider la séance du ${fmtD(ds)}</button>` : ''}
      <button class="btn block" id="wo-x" style="margin-top:8px">Fermer</button>`;
    if ($('wo-max')) $('wo-max').onclick = () => { upsertTest(todayStr(), { tr:lastMax }); save(); toast('Résultat enregistré, le plan s\'ajuste'); $('wo-max').remove(); };
    if ($('wo-val')) $('wo-val').onclick = () => { S.train.log[ds] = { done:true, at:new Date().toISOString(), feel:3, note:`Séance guidée${trs ? ` : ${trs} tractions` : ''}${lastMax != null ? `, max ${lastMax}` : ''}` }; save(); toast('Séance validée 💪'); closeOv(); };
    $('wo-x').onclick = closeOv;
  }
  // Écran d'accueil : le programme
  const lines = wo.map(ex => `<li><b>${ex.ico || ''} ${esc(ex.name)}</b> · ${ex.type === 'timer' ? fmtSec(ex.d) : ex.type === 'reps' ? `${ex.sets} × ${ex.reps}, récup ${fmtSec(ex.rest)}` : ex.type === 'hold' ? `${ex.sets} × ${fmtSec(ex.hold)}, récup ${fmtSec(ex.rest)}` : ex.type === 'emom' ? `${ex.min} min × ${ex.reps}` : ex.type === 'list' ? ex.list.join('-') : ex.type === 'max' ? `récup ${fmtSec(ex.rest)} après` : `jusqu'à ${ex.total} au total`}</li>`).join('');
  $('ov-body').innerHTML = `<div class="card" style="margin-top:8px"><b>Au programme</b><ul style="margin:8px 0 0;padding-left:18px;line-height:1.6;font-size:14.5px">${lines}</ul></div>
    <p class="muted small">L'appli t'annonce chaque série, chronomètre les repos et la chaise, et passe toute seule à la suite. Garde l'écran allumé.</p>
    <button class="btn primary block" id="wo-start" style="height:58px;font-size:17px">C'est parti</button>`;
  $('wo-start').onclick = () => { audio(); next(); };
}

function setTab(t){
  S.ui.tab = t; save();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + t));
  $('hdr-sub').textContent = { dossier:'Mon dossier de candidature', train:'Préparation physique', quiz:'Culture pompier de Paris' }[t];
  render(); window.scrollTo({ top:0 });
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
function render(){
  renderDossier(); renderTrain(); renderQuiz(); checkBadges();
}
let lastDay = todayStr();
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayStr() !== lastDay){ lastDay = todayStr(); planWeekOffset = null; render(); } });
setTab(S.ui.tab || 'dossier');

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
