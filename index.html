<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d0c" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Objectif BSPP">
<title>Objectif BSPP</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3f1; --surface:#ffffff; --s2:#f2ede9; --s3:#e9e2dc;
  --border:#e7dfd9; --border-strong:#d3c8c0;
  --text:#1d1714; --dim:#675d57; --faint:#9b908a;
  --accent:#d3202f; --accent-2:#ff6a3d; --accent-soft:rgba(211,32,47,.10); --on-accent:#fff;
  --ok:#0f8f57; --ok-soft:rgba(15,143,87,.12);
  --warn:#b8720b; --warn-soft:rgba(214,145,24,.15);
  --info:#2563c9; --info-soft:rgba(37,99,201,.11);
  --shadow:0 1px 2px rgba(29,23,20,.05),0 8px 28px rgba(29,23,20,.07);
  --sheet-shadow:0 -12px 40px rgba(29,23,20,.2);
  --grid:#ece5df;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110d0c; --surface:#1b1615; --s2:#241e1c; --s3:#2f2724;
    --border:#2c2522; --border-strong:#40362f;
    --text:#f6f0ec; --dim:#b3a8a2; --faint:#7d726c;
    --accent:#ff4a59; --accent-2:#ff8a4c; --accent-soft:rgba(255,74,89,.14); --on-accent:#fff;
    --ok:#3fd893; --ok-soft:rgba(63,216,147,.13);
    --warn:#f5b84c; --warn-soft:rgba(245,184,76,.14);
    --info:#6aa3ff; --info-soft:rgba(106,163,255,.13);
    --shadow:none; --sheet-shadow:0 -12px 40px rgba(0,0,0,.55);
    --grid:#2a2321;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110d0c; --surface:#1b1615; --s2:#241e1c; --s3:#2f2724;
  --border:#2c2522; --border-strong:#40362f;
  --text:#f6f0ec; --dim:#b3a8a2; --faint:#7d726c;
  --accent:#ff4a59; --accent-2:#ff8a4c; --accent-soft:rgba(255,74,89,.14); --on-accent:#fff;
  --ok:#3fd893; --ok-soft:rgba(63,216,147,.13);
  --warn:#f5b84c; --warn-soft:rgba(245,184,76,.14);
  --info:#6aa3ff; --info-soft:rgba(106,163,255,.13);
  --shadow:none; --sheet-shadow:0 -12px 40px rgba(0,0,0,.55);
  --grid:#2a2321;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,h4,.display{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:70px}
a{color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--accent-2),var(--accent));display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(211,32,47,.35)}
.logo svg{width:20px;height:20px}
.top h1{font-size:19px;font-weight:800;flex:1;line-height:1.1}
.top h1 small{display:block;font:500 12px Figtree,sans-serif;color:var(--dim);letter-spacing:0}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--dim)}
.icon-btn:active{background:var(--s2)}
.icon-btn svg{width:22px;height:22px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:64px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:12px;font-weight:600;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute;top:9px;left:calc(50% + 8px);min-width:8px;height:8px;border-radius:8px;background:var(--accent)}

/* Views */
.view{display:none;padding:6px 0 24px}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec-title h3{font-size:17px;font-weight:700}
.sec-title span{color:var(--faint);font-size:13px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card.tight{padding:6px 0}
.muted{color:var(--dim)}
.faint{color:var(--faint)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--border);margin:12px 0}

/* Hero */
.hero{border-radius:24px;padding:18px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,var(--accent-2) 0%,var(--accent) 45%,#8f1020 100%);position:relative;overflow:hidden;margin:6px 0 12px;box-shadow:0 10px 30px rgba(211,32,47,.28)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero .big{font:800 34px/1.05 "Bricolage Grotesque",sans-serif;margin:4px 0 2px}
.hero .sub{opacity:.88;font-size:14px}
.hero .row{position:relative;z-index:1}
.ring{width:84px;height:84px;flex:none}
.ring text{font:800 20px "Bricolage Grotesque",sans-serif;fill:#fff}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;background:var(--s2);font-weight:700;border:1px solid var(--border);white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 12px;border-radius:11px;font-size:14px}
.btn.white{background:#fff;color:#b3121f;border-color:transparent}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

/* Segmented */
.seg{display:flex;background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:3px;gap:2px;margin:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;height:36px;border-radius:11px;font-weight:700;font-size:14px;color:var(--dim);padding:0 10px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* Lists / checklist */
.item{display:flex;gap:12px;padding:13px 16px;align-items:flex-start;border-top:1px solid var(--border)}
.item:first-child{border-top:0}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center;margin-top:1px;transition:.15s}
.chk svg{width:16px;height:16px;opacity:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.on svg{opacity:1}
.item .t{font-weight:700}
.item .d{color:var(--dim);font-size:13.5px;margin-top:2px}
.item.done .t{color:var(--dim)}
.item .more{margin-top:8px;font-size:13.5px;color:var(--dim);display:none}
.item.open .more{display:block}
.item .more p{margin:6px 0}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--s2);color:var(--dim);white-space:nowrap}
.tag.red{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.info{background:var(--info-soft);color:var(--info)}

.note{background:var(--info-soft);color:var(--text);border-radius:16px;padding:12px 14px;font-size:13.5px;margin:12px 0}
.note b{color:var(--info)}
.warnbox{background:var(--warn-soft);border-radius:16px;padding:12px 14px;font-size:13.5px;margin:12px 0}

/* Steps timeline */
.steps{position:relative;padding:4px 0}
.step{display:flex;gap:12px;padding:10px 16px;position:relative}
.step::before{content:"";position:absolute;left:29px;top:40px;bottom:-10px;width:2px;background:var(--border)}
.step:last-child::before{display:none}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--s2);border:2px solid var(--border-strong);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;z-index:1}
.step.on .n{background:var(--ok);border-color:var(--ok);color:#fff}

/* Session card */
.sess-head{display:flex;gap:12px;align-items:center}
.sess-ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none;font-size:24px}
.sess-ico.run{background:var(--info-soft)}
.sess-ico.str{background:var(--accent-soft)}
.sess-ico.test{background:var(--warn-soft)}
.sess-ico.rest{background:var(--ok-soft)}
.sess-head h3{font-size:19px;line-height:1.15}
.block{margin-top:14px}
.block h4{font:700 12px Figtree,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.block ul{margin:0;padding:0;list-style:none}
.block li{padding:7px 0 7px 22px;position:relative;border-top:1px dashed var(--border)}
.block li:first-child{border-top:0}
.block li::before{content:"";position:absolute;left:4px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.block.main li::before{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.block.soft li::before{background:var(--faint)}
.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tg{background:var(--s2);border-radius:14px;padding:10px;text-align:center}
.tg b{display:block;font:800 18px "Bricolage Grotesque",sans-serif}
.tg span{font-size:11.5px;color:var(--dim)}
.done-banner{display:flex;align-items:center;gap:10px;background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:10px 12px;font-weight:700;margin-top:14px}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.wd{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 2px;text-align:center;font-size:11px;color:var(--dim);position:relative}
.wd b{display:block;font:800 17px "Bricolage Grotesque",sans-serif;color:var(--text);margin:1px 0}
.wd i{display:block;font-style:normal;font-size:15px;height:18px}
.wd.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.wd.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.wd.sel b{color:#fff}
.wd.rest{opacity:.65}
.wd .st{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%}
.wd .st.ok{background:var(--ok)}
.wd .st.miss{background:var(--accent)}

.wknav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.wknav b{font-size:15px}
.dayrow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}
.dayrow:first-child{border-top:0}
.dayrow .dt{width:44px;text-align:center;flex:none}
.dayrow .dt b{display:block;font:800 18px "Bricolage Grotesque",sans-serif}
.dayrow .dt span{font-size:11px;color:var(--faint);text-transform:uppercase;font-weight:700}
.dayrow.today{background:var(--accent-soft)}

.phasebar{display:flex;height:10px;border-radius:10px;overflow:hidden;margin:10px 0 6px;position:relative}
.phasebar div{height:100%}
.phasebar .cur{position:absolute;top:-4px;width:4px;height:18px;border-radius:3px;background:var(--text);transform:translateX(-2px)}
.ph-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}

/* Goals */
.goal{padding:12px 0;border-top:1px solid var(--border)}
.goal:first-child{border-top:0;padding-top:2px}
.goal .row{justify-content:space-between}
.bar{height:10px;border-radius:10px;background:var(--s2);overflow:hidden;margin-top:8px;position:relative}
.bar > div{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.bar .exp{position:absolute;top:-3px;width:3px;height:16px;background:var(--text);opacity:.55;border-radius:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 10px;text-align:center}
.kpi b{display:block;font:800 22px "Bricolage Grotesque",sans-serif}
.kpi span{font-size:11.5px;color:var(--dim)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--faint);font-size:10px;font-family:Figtree,sans-serif}
.chart .goalline{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:5 4}
.chart .expline{stroke:var(--faint);stroke-width:1.5;stroke-dasharray:2 4;fill:none}
.chart .real{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .area{fill:var(--accent-soft)}
.chart .today{stroke:var(--text);stroke-width:1;opacity:.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px;margin-top:10px}
.heat .pad{background:transparent}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:10px;font-size:9px;color:var(--faint);line-height:1}
.heat-wrap{display:flex;gap:6px}
.heat-wrap .heat{flex:1}
.heat div{aspect-ratio:1;border-radius:3px;background:var(--s2)}
.heat .r{background:transparent;border:1px dashed var(--border)}
.heat .ok{background:var(--ok)}
.heat .miss{background:var(--accent);opacity:.55}
.heat .fut{background:var(--s2);opacity:.5}
.heat .td{outline:2px solid var(--text)}

/* Tools */
.tool{display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--border);width:100%;text-align:left}
.tool:first-child{border-top:0}
.tool .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s2);font-size:22px;flex:none}
.chev{color:var(--faint);width:20px;height:20px;flex:none}

/* Overlay (tools + quiz) */
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.ov.on{display:flex;animation:fade .2s ease}
.ov-head{display:flex;align-items:center;gap:10px;height:58px;padding:0 12px;max-width:560px;width:100%;margin:0 auto}
.ov-head h2{font-size:18px;flex:1}
.ov-body{flex:1;overflow:auto;max-width:560px;width:100%;margin:0 auto;padding:6px 16px 24px}
.timer{font:800 76px/1 "Bricolage Grotesque",sans-serif;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:14px 0}
.timer.sm{font-size:56px}
.lbl{text-align:center;color:var(--dim);font-weight:600}
.bigstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.bigstat div{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 6px;text-align:center}
.bigstat b{display:block;font:800 26px "Bricolage Grotesque",sans-serif}
.bigstat span{font-size:12px;color:var(--dim)}
.counter{width:220px;height:220px;border-radius:50%;margin:16px auto;display:grid;place-items:center;background:var(--accent);color:#fff;font:800 86px "Bricolage Grotesque",sans-serif;box-shadow:0 14px 40px rgba(211,32,47,.35);user-select:none}
.counter:active{transform:scale(.97)}
.prog{height:8px;border-radius:8px;background:var(--s2);overflow:hidden;margin:10px 0}
.prog div{height:100%;background:var(--accent);transition:width .2s linear}
.simsteps{display:flex;gap:6px;margin:6px 0 4px}
.simsteps div{flex:1;height:6px;border-radius:6px;background:var(--s2)}
.simsteps div.on{background:var(--accent)}
.simsteps div.done{background:var(--ok)}
.flash{animation:flash .35s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--bg)}}

/* Quiz */
.qtheme{display:inline-flex;margin-bottom:10px}
.qtext{font:700 21px/1.3 "Bricolage Grotesque",sans-serif;margin:4px 0 18px}
.choice{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;font-weight:600;font-size:15.5px;transition:.12s}
.choice:active{transform:scale(.99)}
.choice.good{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--accent);background:var(--accent-soft)}
.choice.dimmed{opacity:.55}
.expl{background:var(--s2);border-radius:16px;padding:12px 14px;margin-top:6px;font-size:14.5px}
.expl b.g{color:var(--ok)} .expl b.b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--s2);border:1px solid var(--border);font-weight:600;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fiche{display:flex;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--border);width:100%;text-align:left}
.fiche:first-child{border-top:0}
.fiche .em{font-size:22px;width:36px;text-align:center;flex:none}
.fiche-body h4{font-size:16px;margin:18px 0 6px}
.fiche-body p{margin:8px 0}
.fiche-body ul{padding-left:20px;margin:6px 0}
.fiche-body li{margin:4px 0}
.fiche-body table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.fiche-body td,.fiche-body th{border-bottom:1px solid var(--border);padding:7px 6px;text-align:left;vertical-align:top}
.fiche-body th{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.fiche-body .src{font-size:12px;color:var(--faint);margin-top:16px}
.tbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--border)}
.tbar:first-child{border-top:0}
.tbar .bar{flex:1;margin:0}
.res-list .rq{padding:10px 0;border-top:1px solid var(--border);font-size:14px}
.res-list .rq:first-child{border-top:0}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:none}
.scrim.on{display:block;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--sheet-shadow);max-height:88vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s linear .25s;padding:8px 0 calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--border-strong);margin:4px auto 10px}
.sheet-x{position:absolute;top:8px;right:10px;width:36px;height:36px;border-radius:50%;background:var(--s2)}
.sheet-x svg{width:18px;height:18px}
.sheet h3{padding-right:40px}
.sheet .in{max-width:560px;margin:0 auto;padding:0 18px}
.sheet h3{font-size:20px;margin-bottom:6px}
.field{margin:12px 0}
.field label{display:block;font-size:13px;font-weight:700;color:var(--dim);margin-bottom:6px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.feel{display:flex;gap:6px}
.feel button{flex:1;height:50px;border-radius:14px;background:var(--s2);border:2px solid var(--border);font-size:22px}
.feel button.on{border-color:var(--accent);background:var(--accent-soft)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;padding:24px 10px;color:var(--dim)}
.foot{color:var(--faint);font-size:12px;text-align:center;margin:20px 0 6px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="logo"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2c.6 3.2-1 5-2.6 6.7C7.8 10.4 6 12.2 6 15a6 6 0 0 0 12 0c0-2.3-1-4.1-2.3-5.6.1 1.7-.5 3-1.7 3.6.4-3.8-.7-7.6-2-11z"/></svg></div>
    <h1>Objectif BSPP<small id="hdr-sub">Sapeur-pompier de Paris</small></h1>
    <button class="icon-btn" id="btn-settings" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-dossier"></section>
  <section class="view" id="v-train"></section>
  <section class="view" id="v-quiz"></section>
</main>

<nav class="tabs">
  <div class="wrap">
    <button class="tab" data-tab="dossier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="m9 15 2 2 4-4"/></svg>Dossier<span class="dot" id="dot-dossier" hidden></span></button>
    <button class="tab" data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 17.5h11M3 9.5v5M21 9.5v5M6.5 4v16M17.5 4v16"/></svg>Entraînement<span class="dot" id="dot-train" hidden></span></button>
    <button class="tab" data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>Quiz &amp; fiches<span class="dot" id="dot-quiz" hidden></span></button>
  </div>
</nav>

<div class="ov" id="ov">
  <div class="ov-head">
    <button class="icon-btn" id="ov-close" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <h2 id="ov-title"></h2>
    <span id="ov-extra" class="faint small"></span>
  </div>
  <div class="ov-body" id="ov-body"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><button class="icon-btn sheet-x" id="sheet-x" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div class="in" id="sheet-in"></div></div>
<div class="toast" id="toast"></div>

<script src="data/questions.js"></script>
<script src="data/fiches.js"></script>
<script>
'use strict';
/* =========================================================
   Utilitaires
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ds(new Date());
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const dd = (a, b) => Math.round((pd(b) - pd(a)) / 864e5); // jours de a à b
const mondayOf = s => { const d = pd(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return ds(d); };
const addMonths = (s, n) => { const d = pd(s); d.setMonth(d.getMonth()+n); return ds(d); };
const DOW = ['dim','lun','mar','mer','jeu','ven','sam'];
const DOWL = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MON = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fmtD = s => { const d = pd(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtDL = s => { const d = pd(s); return `${DOWL[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtSec = s => { s = Math.round(s); const m = Math.floor(s/60), r = s%60; return m ? `${m} min${r?` ${pad(r)}`:''}` : `${r} s`; };
const fmtClock = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s/60)}:${pad(s%60)}`; };
const r5 = v => Math.round(v/5)*5;
const hash = str => { let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const shuffle = (arr, rnd=Math.random) => { const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const ICON_CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';

function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2200); }
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* =========================================================
   Données par défaut
   ========================================================= */
const DOSSIER_DEFAULT = [
  {id:'cni', g:'Identité', t:"Carte d'identité (ou passeport) en cours de validité", d:"Copie recto/verso, lisible.", m:"Si elle expire bientôt, refais-la tout de suite : le dossier peut être bloqué par une pièce périmée."},
  {id:'naiss', g:'Identité', t:"Extrait d'acte de naissance avec filiation", d:"Récent (souvent moins de 3 mois).", m:"Gratuit. Demande en ligne sur service-public.fr ou à la mairie de ton lieu de naissance. Si tu es né à l'étranger, c'est le service central d'état civil (Nantes)."},
  {id:'livret', g:'Identité', t:"Copie du livret de famille", d:"Pages des parents + ta page.", m:"Demande-le à tes parents. Certaines listes acceptent l'acte de naissance à la place."},
  {id:'jdc', g:'Administratif', t:"Attestation de participation à la JDC", d:"Journée défense et citoyenneté.", m:"Téléchargeable sur majdc.fr. Elle est obligatoire pour s'engager. Si tu ne l'as pas faite, demande au CIRFA comment régulariser."},
  {id:'diplome', g:'Administratif', t:"Diplôme le plus élevé", d:"Au minimum le brevet des collèges (ou relevé de notes).", m:"Si tu as perdu le diplôme, demande une attestation de réussite à l'académie ou au lycée."},
  {id:'domicile', g:'Administratif', t:"Justificatif de domicile récent", d:"Facture, quittance… de moins de 3 mois.", m:"Si tu vis chez tes parents : leur justificatif + une attestation d'hébergement signée + copie de leur pièce d'identité."},
  {id:'vitale', g:'Administratif', t:"Carte Vitale ou attestation de droits", d:"Attestation téléchargeable sur ameli.fr.", m:"Compte ameli → Mes attestations → Attestation de droits."},
  {id:'rib', g:'Administratif', t:"RIB à ton nom", d:"Pour le versement de la solde.", m:"Téléchargeable dans l'appli de ta banque."},
  {id:'permis', g:'Administratif', t:"Permis de conduire recto/verso", d:"Si tu l'as.", m:"Pas obligatoire, mais c'est un plus. Supprime cette ligne si tu ne l'as pas."},
  {id:'photos', g:'Administratif', t:"Photos d'identité récentes", d:"Format officiel.", m:"Le CIRFA te dira combien il en faut."},
  {id:'sante', g:'Santé', t:"Carnet de santé : pages des vaccinations", d:"Toutes les pages vaccins, même vides.", m:"Vérifie que ton nom est écrit sur chaque page. Si un vaccin manque, prends rendez-vous chez ton médecin."},
  {id:'questsante', g:'Santé', t:"Questionnaire de santé rempli", d:"Remis par le CIRFA.", m:"Sois honnête : tout sera vérifié pendant la visite médicale."},
  {id:'fiche', g:'CIRFA', t:"Fiche de renseignements remplie et signée", d:"Document remis par ton conseiller.", m:"Écris lisiblement et vérifie dates et adresses."},
  {id:'cvlm', g:'CIRFA', t:"CV + lettre de motivation", d:"Pourquoi la BSPP, pourquoi toi.", m:"Parle de sport, d'engagement (JSP, associations, secourisme), de travail en équipe. Une page chacun maximum."},
];
const STEPS_DEFAULT = [
  {id:'s1', t:"Rendez-vous au CIRFA", d:"Le conseiller te remet le dossier et le calendrier."},
  {id:'s2', t:"Dossier complet envoyé", d:"Toutes les pièces de la liste au-dessus."},
  {id:'s3', t:"Tests de l'armée de Terre", d:"Visite médicale, tests psychotechniques, Luc Léger, tractions, Killy, entretien de motivation."},
  {id:'s4', t:"Agrément technique BSPP (24 h)", d:"Tests aquatiques à Masséna (Paris 13e), puis à Valenton : tractions max, parcours SPP, quiz, entretien."},
  {id:'s5', t:"Réponse de l'état-major", d:"Dans les deux mois après l'envoi du dossier par le conseiller."},
  {id:'s6', t:"Signature et incorporation", d:"Contrat VDAT d'un an, puis EVAT de 5 ans proposé vers 6 mois."},
];

function freshState(){
  const t = todayStr();
  return {
    v:1, created:t,
    prefs:{theme:'auto'},
    dossier:{ items: DOSSIER_DEFAULT.map(x => ({...x, done:false, at:null, note:''})), steps: STEPS_DEFAULT.map(x => ({...x, done:false, at:null})) },
    // Épreuves annoncées « dans 4 mois » le 7 novembre 2026 → 7 mars 2027 (modifiable dans Outils › Réglages du plan)
    train:{ start:t, exam: EXAM_DEFAULT > addD(t, 30) ? EXAM_DEFAULT : addMonths(t,4), rest:[2,4], goals:{ll:12, tr:30, ki:200}, tests:[], log:{} },
    quiz:{ days:{}, st:{}, read:{} },
    ui:{ tab:'dossier', tsub:'today', qsub:'quiz' }
  };
}
const LS = 'objectif-bspp-v1';
const EXAM_DEFAULT = '2027-03-07';
let S;
function load(){
  try{
    const raw = localStorage.getItem(LS);
    if (raw){ const s = JSON.parse(raw); if (s && s.v === 1){ const f = freshState(); S = {...f, ...s, prefs:{...f.prefs, ...s.prefs}, train:{...f.train, ...s.train, goals:{...f.train.goals, ...(s.train||{}).goals}}, quiz:{...f.quiz, ...s.quiz}, ui:{...f.ui, ...s.ui}}; return; } }
  }catch(e){}
  S = freshState();
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
load();

function applyTheme(){
  const t = S.prefs.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('meta-theme').setAttribute('content', dark ? '#110d0c' : '#f6f3f1');
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* =========================================================
   Feuille (bottom sheet)
   ========================================================= */
function openSheet(html, onMount){
  $('sheet-in').innerHTML = html;
  $('scrim').classList.add('on'); $('sheet').classList.add('on');
  if (onMount) onMount($('sheet-in'));
}
function closeSheet(){ $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); }
$('scrim').addEventListener('click', closeSheet);
$('sheet-x').addEventListener('click', closeSheet);

/* =========================================================
   Overlay (outils, quiz, fiches)
   ========================================================= */
let ovCleanup = null;
function openOv(title, html, cleanup){
  if (ovCleanup) { try{ ovCleanup(); }catch(e){} }
  ovCleanup = cleanup || null;
  $('ov-title').textContent = title; $('ov-extra').textContent = '';
  $('ov-body').innerHTML = html; $('ov-body').scrollTop = 0;
  $('ov').classList.add('on'); document.body.style.overflow = 'hidden';
}
function closeOv(){
  if (ovCleanup) { try{ ovCleanup(); }catch(e){} ovCleanup = null; }
  $('ov').classList.remove('on'); document.body.style.overflow = '';
  releaseWake(); render();
}
$('ov-close').addEventListener('click', closeOv);

let wakeLock = null;
async function keepAwake(){ try{ if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }

/* =========================================================
   Son (bips)
   ========================================================= */
let AC = null;
function audio(){ try{ if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); }catch(e){} return AC; }
function beep(freq=880, dur=0.12, when=0, vol=0.35){
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
}
const beepShuttle = () => { beep(990, .11); vibrate(40); };
const beepPalier = () => { beep(660,.12); beep(660,.12,.18); beep(990,.2,.36); vibrate([60,60,120]); };
const beepEnd = () => { beep(520,.5); vibrate(400); };

/* =========================================================
   PAGE 1 — DOSSIER
   ========================================================= */
function renderDossier(){
  const D = S.dossier, items = D.items;
  const done = items.filter(x => x.done).length, total = items.length;
  const pct = total ? done/total : 0;
  const left = items.filter(x => !x.done);
  const C = 2*Math.PI*34;
  const groups = [...new Set(left.map(x => x.g))];
  const stepsDone = D.steps.filter(s => s.done).length;
  $('dot-dossier').hidden = left.length === 0;

  let html = `
  <div class="hero">
    <div class="row">
      <div class="grow">
        <div class="k">Mon dossier de candidature</div>
        <div class="big">${left.length ? `${left.length} pièce${left.length>1?'s':''} à envoyer` : 'Dossier complet'}</div>
        <div class="sub">${done} / ${total} envoyée${done>1?'s':''}${left.length ? ' · valide chaque pièce dès que tu l\'as envoyée' : ' · bravo, tout est parti'}</div>
      </div>
      <svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 42 42)"/><text x="42" y="49" text-anchor="middle">${Math.round(pct*100)}%</text></svg>
    </div>
  </div>`;

  if (left.length){
    html += `<div class="sec-title"><h3>Ce qu'il te manque</h3><span>touche ○ quand c'est envoyé</span></div>`;
    for (const g of groups){
      html += `<div class="faint small" style="margin:10px 4px 6px;font-weight:700;text-transform:uppercase;letter-spacing:.06em">${esc(g)}</div><div class="card tight">`;
      html += left.filter(x => x.g === g).map(itemRow).join('');
      html += `</div>`;
    }
  } else {
    html += `<div class="card"><div class="row"><div style="font-size:34px">🎉</div><div class="grow"><b>Toutes les pièces sont envoyées.</b><div class="muted small">Garde un œil sur tes mails et ton téléphone : le CIRFA va te convoquer pour la suite.</div></div></div></div>`;
  }
  html += `<button class="btn block" data-act="add-item" style="margin-top:4px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter une pièce demandée</button>`;

  const sent = items.filter(x => x.done).sort((a,b) => (b.at||'').localeCompare(a.at||''));
  if (sent.length){
    html += `<div class="sec-title"><h3>Déjà envoyé</h3><span>${sent.length}</span></div><div class="card tight">${sent.map(itemRow).join('')}</div>`;
  }

  html += `<div class="sec-title"><h3>Étapes du recrutement</h3><span>${stepsDone}/${D.steps.length}</span></div>
  <div class="card tight"><div class="steps">${D.steps.map((s,i) => `
    <div class="step ${s.done?'on':''}">
      <button class="n" data-act="step" data-id="${s.id}" aria-label="Valider l'étape">${s.done ? ICON_CHECK.replace('<svg','<svg style="width:15px;height:15px"') : i+1}</button>
      <div class="grow"><div style="font-weight:700">${esc(s.t)}</div><div class="muted small">${esc(s.d)}${s.done && s.at ? ` · <span class="tag ok">fait le ${fmtD(s.at)}</span>` : ''}</div></div>
    </div>`).join('')}</div></div>
  <div class="note"><b>À adapter :</b> cette liste reprend les pièces que les armées demandent le plus souvent. La liste officielle, c'est celle que t'a donnée ton conseiller CIRFA : supprime ce qui ne te concerne pas et ajoute ce qu'il t'a demandé en plus.</div>`;
  $('v-dossier').innerHTML = html;
}
function itemRow(x){
  return `<div class="item ${x.done?'done':''}" data-id="${x.id}">
    <button class="chk ${x.done?'on':''}" data-act="toggle-item" data-id="${x.id}" aria-label="${x.done?'Marquer non envoyée':'Marquer envoyée'}">${ICON_CHECK}</button>
    <div class="grow" data-act="open-item" data-id="${x.id}">
      <div class="t">${esc(x.t)}</div>
      <div class="d">${x.done && x.at ? `<span class="tag ok">envoyée le ${fmtD(x.at)}</span> ` : ''}${esc(x.d||'')}</div>
      ${x.note ? `<div class="d" style="margin-top:4px">📝 ${esc(x.note)}</div>` : ''}
    </div>
  </div>`;
}
function itemSheet(id){
  const x = S.dossier.items.find(i => i.id === id); if (!x) return;
  openSheet(`
    <h3>${esc(x.t)}</h3>
    <p class="muted">${esc(x.d||'')}</p>
    ${x.m ? `<div class="note"><b>Comment l'obtenir :</b> ${esc(x.m)}</div>` : ''}
    <div class="field"><label>Titre</label><input id="it-t" value="${esc(x.t)}"></div>
    <div class="field"><label>Ma note (où j'en suis, à qui je l'ai envoyée…)</label><textarea id="it-n" placeholder="Ex. : demandé à la mairie le 10/11">${esc(x.note||'')}</textarea></div>

/* =========================================================
   PAGE 2 — ENTRAÎNEMENT : moteur du plan
   ========================================================= */
const EP = { ll:{name:'Luc Léger', unit:'palier', short:'LL'}, tr:{name:'Tractions', unit:'rép.', short:'Tr.'}, ki:{name:'Killy (chaise)', unit:'s', short:'Killy'} };
const DEF = {ll:7, tr:8, ki:90}; // valeurs supposées tant qu'aucun test n'est saisi
const P2V = p => 8 + 0.5*p; // vitesse (km/h) au palier p
const llShuttles = n => Math.max(7, Math.round(P2V(n)/1.2)); // navettes de 20 m dans le palier n (≈ 1 min)
const fmtLL = v => { if (v == null) return '—'; const n = Math.floor(v+1e-9), f = v - n; const s = Math.round(f*60/15)*15; return s ? `${n} + ${s} s` : `${n}`; };
const fmtVal = (k, v) => v == null ? '—' : k === 'll' ? `P${fmtLL(v)}` : k === 'tr' ? `${Math.round(v)}` : fmtSec(v);

function testsSorted(){ return S.train.tests.slice().sort((a,b) => a.date.localeCompare(b.date)); }
function latest(k, upTo){ let v = null; for (const t of testsSorted()) if (t[k] != null && (!upTo || t.date <= upTo)) v = t[k]; return v; }
function best(k){ let v = null; for (const t of S.train.tests) if (t[k] != null && (v == null || t[k] > v)) v = t[k]; return v; }
function baseline(k){ for (const t of testsSorted()) if (t[k] != null) return t[k]; return null; }
function progressX(s){ const T = S.train; return clamp(dd(T.start, s) / Math.max(1, dd(T.start, T.exam) - 10), 0, 1); }
function expected(k, s){ const b = baseline(k) ?? DEF[k], g = S.train.goals[k]; if (b >= g) return b; const x = progressX(s); return b + (g-b) * (1 - Math.pow(1-x, 1.35)); }
function latestDate(k, upTo){ let d = null; for (const t of testsSorted()) if (t[k] != null && (!upTo || t.date <= upTo)) d = t.date; return d; }
function workLevel(k, s){
  // Niveau de référence pour calculer les charges : part du dernier test,
  // monte un peu chaque semaine qui suit (même sans nouveau test) et rattrape la trajectoire prévue.
  const cur = latest(k, s) ?? DEF[k], e = expected(k, s);
  const ld = latestDate(k, s), wks = ld ? Math.max(0, dd(ld, s)) / 7 : Math.max(0, dd(S.train.start, s)) / 7;
  const prog = k === 'll' ? cur + 0.15*wks : cur * (1 + 0.025*wks);
  let w = Math.max(prog, cur + Math.max(0, e - cur)*0.3);
  const cap = Math.max(e, k === 'll' ? cur + 0.75 : cur * 1.2);
  return Math.max(cur, Math.min(w, cap));
}
const isRest = s => S.train.rest.includes(pd(s).getDay());
function firstTrainingDay(){ let s = S.train.start; for (let i=0;i<7;i++){ if (!isRest(s)) return s; s = addD(s,1); } return S.train.start; }
function weekInfo(s){
  const T = S.train, m0 = mondayOf(T.start);
  return { w: Math.floor(dd(m0, s)/7), W: Math.floor(dd(m0, T.exam)/7), m0 };
}
function isDeload(w){
  if (w <= 0 || w % 4) return false;
  const { m0 } = weekInfo(S.train.start);
  const sun = addD(m0, w*7+6);
  return dd(sun, S.train.exam) >= 21;
}
let _specialCache = null;
function specialDays(){
  const T = S.train, key = T.start + T.exam + T.rest.join();
  if (_specialCache && _specialCache.key === key) return _specialCache;
  const out = { key, test:{}, sim:null, first:firstTrainingDay() };
  out.test[out.first] = 'initial';
  const { W, m0 } = weekInfo(T.start);
  for (let w=1; w<=W; w++){
    if (!isDeload(w)) continue;
    let d = addD(m0, w*7+6); // dimanche
    while (isRest(d)) d = addD(d,-1);
    if (d > out.first) out.test[d] = 'test';
  }
  // Simulation complète ≈ 14 jours avant le jour J (de préférence le week-end)
  let bestD = null, bestScore = 1e9;
  for (let k=10; k<=17; k++){
    const d = addD(T.exam, -k); if (d <= out.first || isRest(d)) continue;
    const dow = pd(d).getDay(); const sc = Math.abs(k-14) - ((dow === 0 || dow === 6) ? 1.5 : 0);
    if (sc < bestScore){ bestScore = sc; bestD = d; }
  }
  if (bestD){ out.sim = bestD; out.test[bestD] = 'sim'; }
  _specialCache = out; return out;
}
function phaseOf(s){
  const T = S.train, dte = dd(s, T.exam);
  if (dte <= 13) return 'affutage';
  const p = clamp(dd(T.start, s) / Math.max(1, dd(T.start, T.exam)), 0, 1);
  return p < 0.25 ? 'fondation' : p < 0.6 ? 'developpement' : 'specifique';
}
const PHASES = {
  fondation:{n:'Fondation', c:'#f2a33a', d:"On construit la base : volume progressif, technique stricte, aucune blessure."},
  developpement:{n:'Développement', c:'#ff6a3d', d:"On monte l'intensité : VMA plus rapide, plus de tractions, chaise plus longue."},
  specifique:{n:'Spécifique', c:'#d3202f', d:"On colle aux épreuves : navettes au bip, séries max, jambes déjà fatiguées."},
  affutage:{n:'Affûtage', c:'#0f8f57', d:"On baisse le volume pour arriver frais et au top le jour J."}
};

/* ---- Blocs réutilisables ---- */
const WARM_RUN = ["10–15 min de footing très lent (tu dois pouvoir parler)", "Gammes : montées de genoux, talons-fesses, pas chassés (2 × 20 m chacun)", "3 accélérations progressives sur 60 m"];
const WARM_UP = ["5 min de corde à sauter ou de footing", "Mobilité épaules : 10 cercles de bras, 10 rotations de poignets", "Suspension passive à la barre 2 × 20 s", "2 × 3 tractions faciles"];
const COOL = ["5–10 min de trot ou de marche", "Étirements doux 5 min : mollets, quadriceps, ischios, dos"];
const tractionRule = "Tractions strictes en pronation (paumes vers l'avant) : départ bras tendus, menton au-dessus de la barre, sans balancer les jambes.";
const killyRule = "Killy : dos plaqué au mur, cuisses parallèles au sol, genoux à 90°, pieds à plat. Ne bouge plus jusqu'à la fin.";

function buildSession(s){
  const T = S.train;
  if (s < T.start) return { kind:'none', title:'Avant le début du plan', ico:'📅', cls:'rest', blocks:[] };
  const dte = dd(s, T.exam);
  if (dte < 0) return { kind:'none', title:'Après le jour J', ico:'🏁', cls:'rest', blocks:[{h:'Et maintenant ?', items:["Repos complet 2–3 jours, puis reprends 3 séances par semaine pour garder le niveau jusqu'à l'agrément technique."]}] };
  const L = { ll:workLevel('ll', s), tr:workLevel('tr', s), ki:workLevel('ki', s) };
  const G = T.goals;
  const P = L.ll, V = P2V(P), Tr = Math.max(1, L.tr), K = Math.max(20, L.ki);
  const { w } = weekInfo(s);
  const phase = phaseOf(s), deload = isDeload(w) && phase !== 'affutage';
  const dow = pd(s).getDay();
  const sp = specialDays();
  const est = latest('tr', s) == null || latest('ll', s) == null || latest('ki', s) == null;
  const rep = f => Math.max(1, Math.round(Tr*f));
  const sec = f => Math.max(10, r5(K*f));
  const d30 = pct => r5(V*pct*1000/3600*30);
  const d15 = pct => r5(V*pct*1000/3600*15);
  const dmin = (pct, min) => r5(V*pct*1000/60*min);
  const kmh = pct => (V*pct).toFixed(1).replace('.', ',');
  const pace = pct => { const m = 60/(V*pct); const mm = Math.floor(m), ss = Math.round((m-mm)*60); return `${mm}'${pad(ss===60?0:ss)}/km`; };
  const dl = x => deload ? Math.max(1, Math.round(x*0.7)) : x;
  const base = { phase, deload, w, dte, est, L };

  if (dte === 0) return { ...base, kind:'exam', title:'Jour J — les épreuves', ico:'🔥', cls:'test', dur:'≈ 1 h 15', blocks:[
    {h:'Déroulé', cls:'main', items:["Luc Léger (navettes de 20 m au bip)", "15 min de récupération", "Tractions maximum", "15 min de récupération", "Test de Killy (la chaise)"]},
    {h:'Avant', items:["Petit-déjeuner habituel 2 h 30 avant (rien de nouveau aujourd'hui)", "Pièce d'identité, convocation, tenue de sport, baskets avec lesquelles tu t'es entraîné", "Gourde + une banane ou une compote pour les pauses", "Échauffement 12–15 min : footing lent, gammes, 2 accélérations, 2 × 3 tractions faciles"]},
    {h:'Pendant les 15 min de pause', items:["Marche, bois quelques gorgées, reste au chaud", "Après le Luc Léger : 2 tractions faciles 3 min avant l'épreuve", "Avant le Killy : 5 squats lents et 10 s de chaise pour trouver la bonne position"]},
    {h:'Dans ta tête', cls:'soft', items:["Luc Léger : reste collé à la ligne, virages courts, ne pars pas trop vite", "Tractions : rythme régulier, souffle en montant, pas d'élan", "Killy : fixe un point, respire lentement, compte par tranches de 30 s"]}
  ]};
  if (dte <= 2) return { ...base, kind:'rest', title: dte === 1 ? 'Veille du jour J — repos' : 'Repos avant les épreuves', ico:'😴', cls:'rest', dur:'—', blocks:[
    {h:'Aujourd\'hui', items: dte === 1 ? ["Repos complet ou 15 min de marche", "Prépare ton sac et ta tenue", "Repas riche en glucides (pâtes, riz), beaucoup d'eau", "Couche-toi tôt : 8 h de sommeil minimum"] : ["20 min de footing très facile + 4 lignes droites de 60 m", "Mobilité 10 min", "Bien manger, bien dormir"]}
  ]};
  if (isRest(s)) return { ...base, kind:'rest', title:'Repos — récupération', ico:'🛌', cls:'rest', dur:'facultatif 20 min', blocks:[
    {h:'Récupération active (facultatif)', items:["20–30 min de marche ou de vélo très léger", "Mobilité 10 min : hanches, épaules, chevilles", "Gainage léger 2 × 30 s si tu as de l'énergie"]},
    {h:'Le vrai travail du jour', cls:'soft', items:["C'est pendant le repos que les muscles progressent", "8 h de sommeil, 2 L d'eau, des protéines à chaque repas", "Fais ton quiz du jour 📚"]}
  ]};

  const kindT = sp.test[s];
  if (kindT){
    const initial = kindT === 'initial', sim = kindT === 'sim';
    return { ...base, kind:'test', test:true, title: initial ? 'Évaluation de départ' : sim ? 'Simulation complète du jour J' : 'Test de contrôle', ico:'⏱️', cls:'test', dur:'≈ 1 h 15', blocks:[
      {h:'Pourquoi', cls:'soft', items:[ initial ? "On mesure ton niveau réel : tout le plan se cale ensuite sur ces résultats." : sim ? "Répétition générale dans les conditions exactes du jour J. Après ça, on affûte." : "On mesure tes progrès : le plan s'ajuste automatiquement à tes nouveaux chiffres."]},
      {h:'Échauffement', items:WARM_RUN},
      {h:'Épreuves (dans l\'ordre officiel)', cls:'main', items:["Luc Léger jusqu'à l'arrêt (Outils › Simulation, ou une appli de bip)", "15 min de récupération (marche, eau)", "Tractions maximum, strictes", "15 min de récupération", "Killy : tiens le plus longtemps possible"]},
      {h:'Règles', cls:'soft', items:[tractionRule, killyRule]}
    ]};
  }

  const blocks = [];
  let title = '', ico = '🏃', cls = 'run', dur = '';
  const gtg = n => `Après la course : ${n} séries de ${rep(0.4)} tractions faciles (récup 2 min). On « graisse le geste », jamais à l'échec.`;

  if (dow === 1){ // Lundi — VMA courte
    title = 'Course — VMA courte'; ico = '⚡'; dur = '≈ 50 min';
    blocks.push({h:'Échauffement', items:WARM_RUN});
    const main = [];
    if (phase === 'fondation'){
      const reps = dl(8 + Math.min(4, w));
      main.push(`2 séries de ${reps} × 30 s vite / 30 s trot`, `En 30 s, couvre ${d30(1.0)} m (≈ ${kmh(1.0)} km/h)`, `3 min de trot entre les 2 séries`);
    } else if (phase === 'developpement'){
      if (w % 2 === 0){ const ser = dl(2 + (progressX(s) > 0.42 ? 1 : 0)); main.push(`${ser} série${ser>1?'s':''} de 10 × 30 s vite / 30 s trot`, `En 30 s, couvre ${d30(1.05)} m (≈ ${kmh(1.05)} km/h)`, `3 min de trot entre les séries`); }
      else { const reps = dl(12); main.push(`2 séries de ${reps} × 15 s très vite / 15 s trot`, `En 15 s, couvre ${d15(1.12)} m`, `3 min de trot entre les séries`); }
    } else if (phase === 'specifique'){
      const P1 = Math.min(Math.floor(P)+1, G.ll+1), r = dl(5 + (w % 3));
      main.push(`Navettes de 20 m au bip : ${r} × 1 min au palier ${P1} (${String(P2V(P1)).replace('.',',')} km/h), 1 min de marche entre chaque — Outils › Bip Luc Léger`, `Puis 8 × 30/30 : ${d30(1.1)} m en 30 s`);
    } else { // affûtage
      main.push(`6 × 30 s vite / 30 s trot : ${d30(1.0)} m en 30 s`, `3 × 1 min de navettes au palier ${Math.floor(G.ll)} (pour garder le rythme des virages)`);
    }
    blocks.push({h:'Corps de séance', cls:'main', items:main});
    const extra = [gtg(phase === 'affutage' ? 2 : 3)];
    if (phase === 'specifique') extra.push(`Killy sur jambes fatiguées, comme le jour J : 2 × ${fmtSec(sec(0.5))}, récup 1 min`);
    blocks.push({h:'Complément', items:extra});
    blocks.push({h:'Retour au calme', cls:'soft', items:COOL});
  }
  else if (dow === 3){ // Mercredi — force tractions + Killy
    title = 'Tractions force + chaise'; ico = '💪'; cls = 'str'; dur = '≈ 45 min';
    blocks.push({h:'Échauffement', items:WARM_UP});
    const main = [];
    if (phase === 'fondation'){
      main.push(`${dl(5 + Math.min(2, w))} séries de ${rep(0.5)} tractions strictes, récup 2 min 30`, `Négatives : 3 × 3 descentes lentes (5 s), saute pour te mettre menton au-dessus`);
    } else if (phase === 'developpement'){
      const n = clamp(Math.round(Tr*0.32), 3, 10);
      main.push(`Pyramide : 1-2-3…${n}…3-2-1 tractions (${n*n} au total), récup = 10 s × le nombre que tu viens de faire`, w % 2 ? `Lest (sac à dos avec 5 kg) : 4 × ${Math.max(2, rep(0.25))}, récup 3 min — sinon 4 × ${rep(0.4)} avec 3 s de pause en haut` : `4 × ${rep(0.4)} avec 3 s de pause menton au-dessus de la barre, récup 2 min`);
    } else if (phase === 'specifique'){
      main.push(`1 série MAX (note le chiffre dans Évolution, c'est un bon indicateur)`, `Récup 4 min, puis ${dl(5)} × ${rep(0.6)}, récup 90 s`, `Finisher : ${rep(0.3)} tractions supination (paumes vers toi)`);
    } else {
      main.push(`3 × ${rep(0.5)} tractions, récup 2 min 30 — vitesse et qualité, rien d'autre`);
    }
    blocks.push({h:'Tractions', cls:'main', items:main});
    const kf = phase === 'fondation' ? 0.6 : phase === 'developpement' ? 0.7 : phase === 'specifique' ? 0.75 : 0.5;
    const kn = phase === 'affutage' ? 2 : dl(4);
    blocks.push({h:'Killy (chaise)', cls:'main', items:[`${kn} × ${fmtSec(sec(kf))}, récup 1 min`, killyRule]});
    blocks.push({h:'Renfo', items:[`Pompes : ${dl(3)} × ${phase==='fondation'?12:15}`, `Gainage planche : 3 × ${phase==='fondation'?40:60} s`, `Suspension à la barre (grip) : 2 × ${phase==='fondation'?30:45} s`]});
    blocks.push({h:'Retour au calme', cls:'soft', items:["Étirements dorsaux et pectoraux 5 min", "Quadriceps et fessiers 3 min"]});
  }
  else if (dow === 5){ // Vendredi — endurance / VMA longue
    title = 'Course — VMA longue'; ico = '🏃'; dur = '≈ 50 min';
    blocks.push({h:'Échauffement', items:WARM_RUN});
    const main = [];
    if (phase === 'fondation'){
      const tot = dl(25 + 2*Math.min(w, 5));
      main.push(`Footing de ${tot} min à allure confortable (${pace(0.7)})`, `Dedans : 6 × 1 min un peu vite (${kmh(0.9)} km/h, ${dmin(0.9,1)} m) / 1 min lent`);
    } else if (phase === 'developpement'){
      if (w % 2) main.push(`${dl(5)} × 3 min à 90 % VMA : ${dmin(0.9,3)} m en 3 min, récup 1 min 30 en trottinant`);
      else main.push(`${dl(4)} × 4 min à 85–90 % VMA : ${dmin(0.87,4)} m en 4 min, récup 2 min`);
    } else if (phase === 'specifique'){
      const Pi = Math.max(3, Math.floor(P)), Pa = Math.max(1, Pi-2);
      main.push(`Luc Léger fractionné au bip : ${dl(3)} × (paliers ${Pa} → ${Pi} enchaînés, ≈ 3 min), récup 2 min 30`, `Puis 2 × 2 min au palier ${Math.min(Pi+1, G.ll)}, récup 2 min`);
    } else {
      main.push(`20 min de footing facile`, `4 lignes droites de 80 m en accélérant`);
    }
    blocks.push({h:'Corps de séance', cls:'main', items:main});
    blocks.push({h:'Complément', items:[gtg(2), `Gainage : planche 3 × ${phase==='fondation'?40:60} s + planche latérale 2 × 30 s par côté`]});
    blocks.push({h:'Retour au calme', cls:'soft', items:COOL});
  }
  else if (dow === 6){ // Samedi — volume tractions + jambes
    title = 'Volume tractions + jambes'; ico = '🦵'; cls = 'str'; dur = '≈ 55 min';
    blocks.push({h:'Échauffement', items:WARM_UP});
    const main = [];
    if (phase === 'fondation'){
      const n = dl(10 + Math.min(w, 4));
      main.push(`EMOM ${n} min : au début de chaque minute, ${rep(0.3)} tractions, repos le reste de la minute (${n*rep(0.3)} au total)`);
    } else if (phase === 'developpement'){
      if (w % 2) { const n = dl(14 + Math.min(4, w-4)); main.push(`EMOM ${n} min : ${rep(0.35)} tractions par minute (${n*rep(0.35)} au total)`); }
      else { const top = clamp(Math.round(Tr*0.3), 3, 8); main.push(`Échelles : 1-2-3…${top} tractions, 3 échelles, récup 2 min entre chaque (${3*top*(top+1)/2} au total)`); }
    } else if (phase === 'specifique'){
      main.push(`1 série MAX, récup 3 min`, `Puis séries de ${rep(0.5)} (récup 1 min 30) jusqu'à ${dl(Math.round(Tr*3))} tractions au total`);
    } else {
      main.push(`EMOM 8 min : ${rep(0.3)} tractions par minute`);
    }
    blocks.push({h:'Tractions', cls:'main', items:main});
    const ki = phase === 'affutage' ? [`2 × ${fmtSec(sec(0.5))}, récup 1 min 30`] :
      phase === 'specifique' ? [`1 × ${fmtSec(sec(0.95))} (presque max), récup 3 min`, `2 × ${fmtSec(sec(0.6))}, récup 1 min 30`] :
      [`1 × ${fmtSec(sec(phase==='fondation'?0.85:0.9))}, récup 3 min`, `2 × ${fmtSec(sec(0.55))}, récup 1 min 30`];
    blocks.push({h:'Killy (chaise)', cls:'main', items:ki});
    if (phase !== 'affutage') blocks.push({h:'Jambes', items: phase === 'fondation' ? [`Squats : ${dl(4)} × 15`, `Fentes : 3 × 10 par jambe`, `Mollets : 3 × 20`] : [`Squats sautés : ${dl(3)} × 10`, `Squats lents (3 s en descente) : 3 × 12`, `Fentes : 3 × 12 par jambe`, `Mollets : 3 × 20`]});
    blocks.push({h:'Retour au calme', cls:'soft', items:["Étirements quadriceps, fessiers, dos, épaules 8 min"]});
  }
  else { // Dimanche (ou autre) — footing
    title = 'Footing endurance'; ico = '🌿'; dur = '';
    const min = phase === 'affutage' ? 25 : dl(30 + Math.min(20, 2*w));
    dur = `≈ ${min + 10} min`;
    blocks.push({h:'Séance', cls:'main', items:[`${min} min de footing à allure conversation (${pace(0.68)}, ≈ ${kmh(0.68)} km/h)`, `Finis par 5 lignes droites de 80 m en accélérant progressivement`]});
    blocks.push({h:'Mobilité', items:["10 min : hanches, chevilles, épaules, dos", "Suspension passive à la barre 2 × 30 s (décompresse le dos, renforce la prise)"]});
  }

  if (deload) blocks.unshift({h:'Semaine allégée', cls:'soft', items:["Volume réduit d'environ 30 % cette semaine : c'est voulu, ton corps assimile le travail des 3 dernières semaines. Dimanche : test de contrôle."]});
  return { ...base, kind:'train', title, ico, cls, dur, blocks };
}

function sessionStatus(s){
  const log = S.train.log[s]; const t = todayStr();
  const sess = buildSession(s);
  if (sess.kind === 'none' || sess.kind === 'rest') return { sess, st:'rest' };
  if (log && log.done) return { sess, st:'ok' };
  if (sess.test && S.train.tests.some(x => x.date === s)) return { sess, st:'ok' };
  if (s < t) return { sess, st:'miss' };
  return { sess, st:'todo' };
}

/* ---- Rendu : séance ---- */
function sessionCard(s, opts={}){
  const { sess, st } = sessionStatus(s);
  const L = sess.L;

  if (L && sess.kind === 'train' && !opts.compact) h += `<div class="targets"><div class="tg"><b>P${fmtLL(Math.round(L.ll*4)/4)}</b><span>LL de travail</span></div><div class="tg"><b>${Math.round(L.tr)}</b><span>tractions réf.</span></div><div class="tg"><b>${fmtSec(r5(L.ki))}</b><span>chaise réf.</span></div></div>`;
  if (sess.kind === 'train' || sess.kind === 'test' || sess.kind === 'exam'){
    const log = S.train.log[s];
    if (st === 'ok') h += `<div class="done-banner">${ICON_CHECK.replace('<svg','<svg style="width:20px;height:20px"')}<div class="grow">Séance faite${log && log.feel ? ` · ressenti ${['','😫','😕','🙂','😀','🔥'][log.feel]}` : ''}${log && log.note ? `<div class="small" style="font-weight:500;color:var(--text)">${esc(log.note)}</div>` : ''}</div><button class="btn sm ghost" data-act="undo" data-d="${s}">Annuler</button></div>`;
    else if (s <= todayStr() || opts.allowFuture){
      h += `<div class="btns" style="margin-top:14px">`;
      if (sess.test || sess.kind === 'exam') h += `<button class="btn" data-act="sim">⏱️ Lancer la simulation</button><button class="btn primary" data-act="results" data-d="${s}">Saisir mes résultats</button>`;
      else h += `<button class="btn primary block" data-act="done" data-d="${s}">${ICON_CHECK.replace('<svg','<svg style="width:18px;height:18px"')} J'ai fait la séance</button>`;
      h += `</div>`;

    }
  }
  h += `</div>`;
  return h;
}

function ringSvg(pct, label){
  const C = 2*Math.PI*34;
  return `<svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-clamp(pct,0,1))}" transform="rotate(-90 42 42)"/><text x="42" y="${label?45:49}" text-anchor="middle">${Math.round(pct*100)}%</text>${label?`<text x="42" y="60" text-anchor="middle" style="font:600 10px Figtree,sans-serif;fill:rgba(255,255,255,.85)">${label}</text>`:''}</svg>`;
}
function readiness(){
  const G = S.train.goals; let sum = 0, n = 0;
  for (const k of ['ll','tr','ki']){ const v = best(k); sum += v == null ? 0 : clamp(v/G[k], 0, 1); n++; }
  return { pct: sum/n };
}
function goalsCard(){
  const G = S.train.goals, t = todayStr();
  let h = `<div class="sec-title"><h3>Mes objectifs</h3><span>trait = où tu devrais être</span></div><div class="card">`;
  for (const k of ['ll','tr','ki']){
    const cur = best(k), e = expected(k, t), g = G[k];
    const pct = cur == null ? 0 : clamp(cur/g,0,1), pe = clamp(e/g,0,1);
    const ahead = cur != null && cur >= e - (k==='ll'?0.25:k==='tr'?0.5:5);
    h += `<div class="goal"><div class="row"><b>${EP[k].name}</b><span>${cur==null?'<span class="faint">à mesurer</span>':`<b>${fmtVal(k,cur)}</b>`} <span class="faint">/ ${fmtVal(k,g)}</span></span></div>
      <div class="bar"><div style="width:${pct*100}%"></div><span class="exp" style="left:${pe*100}%"></span></div>
      ${cur!=null?`<div class="small ${ahead?'':'faint'}" style="margin-top:5px;${ahead?'color:var(--ok)':''}">${ahead?'✔ Dans les temps':'Objectif du moment : '+fmtVal(k,e)}</div>`:''}
    </div>`;
  }
  return h + `</div>`;
}
let planWeekOffset = null;
function trainPlan(){
  const T = S.train, t = todayStr();
  const { W, m0 } = weekInfo(T.start);
  const curW = clamp(weekInfo(t).w, 0, W);
  if (planWeekOffset == null) planWeekOffset = curW;

  for (let i=0;i<=total;i++){ const p = phaseOf(addD(T.start,i)); if (p !== prev){ if (prev) segs.push([prev, startI, i]); prev = p; startI = i; } }
  segs.push([prev, startI, total+1]);
  const curPct = clamp(dd(T.start, t)/Math.max(1,total),0,1)*100;
  let h = `<div class="card"><b>Le plan en 4 phases</b><div class="phasebar">${segs.map(([p,a,b]) => `<div style="width:${(b-a)/(total+1)*100}%;background:${PHASES[p].c}"></div>`).join('')}<span class="cur" style="left:${curPct}%"></span></div>
    <div class="ph-legend">${segs.map(([p]) => `<span>${PHASES[p].n}</span>`).join('')}</div>
    <div class="muted small" style="margin-top:8px">${esc(PHASES[phaseOf(addD(mon,3) < T.start ? T.start : addD(mon,3) > T.exam ? T.exam : addD(mon,3))].d)}</div></div>`;
  h += `<div class="wknav"><button class="btn sm" data-act="wk" data-v="-1" ${w<=0?'disabled style="opacity:.4"':''}>‹</button><b>Semaine ${w+1} · ${fmtD(mon)} → ${fmtD(addD(mon,6))}</b><button class="btn sm" data-act="wk" data-v="1" ${w>=W?'disabled style="opacity:.4"':''}>›</button></div>`;
  h += `<div class="card tight">`;
  for (let i=0;i<7;i++){
    const s = addD(mon, i); const { sess, st } = sessionStatus(s);

    h += `<div class="dayrow ${s===t?'today':''}" data-act="day" data-d="${s}" style="cursor:pointer">
      <div class="dt"><span>${DOW[pd(s).getDay()]}</span><b>${pd(s).getDate()}</b></div>
      <div class="sess-ico ${sess.cls}" style="width:38px;height:38px;font-size:18px;border-radius:12px">${sess.ico}</div>
      <div class="grow"><b style="font-size:14.5px">${esc(sess.title)}</b><div class="faint small">${sess.dur||''}</div></div>
      ${stTag}${ICON_CHEV}
    </div>`;
  }
  h += `</div><p class="faint small" style="text-align:center">Les charges (mètres, répétitions, secondes) se recalculent à chaque nouveau test que tu saisis.</p>`;
  return h;
}
function trainEvo(){
  const T = S.train, t = todayStr();
  const sp = specialDays();
  // Assiduité
  let planned = 0, done = 0, streak = 0, streakOn = true;
  const days = [];
  for (let s = T.start; s <= T.exam; s = addD(s,1)) days.push(s);
  for (const s of days.slice().reverse()){
    if (s > t) continue;
    const { st } = sessionStatus(s);
    if (st === 'rest') continue;
    if (s === t && st === 'todo') continue;
    if (streakOn){ if (st === 'ok') streak++; else streakOn = false; }
  }
  for (const s of days){ if (s > t) break; const { st } = sessionStatus(s); if (st === 'rest') continue; if (s === t && st === 'todo') continue; planned++; if (st === 'ok') done++; }
  const r = readiness();
  let h = `<div class="kpis"><div class="kpi"><b>${Math.round(r.pct*100)}%</b><span>prêt pour le jour J</span></div><div class="kpi"><b>${done}/${planned}</b><span>séances faites</span></div><div class="kpi"><b>${streak}🔥</b><span>série en cours</span></div></div>`;
  // Heatmap
  const nWeeks = Math.floor(dd(mondayOf(T.start), T.exam)/7) + 1;
  h += `<div class="card" style="margin-top:12px"><div class="row"><b class="grow">Régularité</b><span class="faint small">${planned?Math.round(done/planned*100):0}% d'assiduité</span></div>
    <div class="heat-wrap"><div class="heat-days">${['L','M','M','J','V','S','D'].map(x => `<span style="display:flex;align-items:center">${x}</span>`).join('')}</div><div class="heat" style="grid-template-columns:repeat(${nWeeks},1fr)">`;
  for (let i = 0, s0 = mondayOf(T.start); i < nWeeks*7; i++){
    const s = addD(s0, i);
    if (s < T.start || s > T.exam){ h += `<div class="pad"></div>`; continue; }
    const { st } = sessionStatus(s); const c = s > t ? (st==='rest'?'r':'fut') : st === 'ok' ? 'ok' : st === 'miss' ? 'miss' : st === 'rest' ? 'r' : 'fut';
    h += `<div class="${c} ${s===t?'td':''}" title="${fmtD(s)}"></div>`;
  }
  h += `</div>`;
  h += `</div><div class="legend"><span><i style="background:var(--ok)"></i>faite</span><span><i style="background:var(--accent);opacity:.55"></i>manquée</span><span><i style="border:1px dashed var(--border-strong);height:8px;width:8px"></i>repos</span></div></div>`;
  // Graphiques
  for (const k of ['ll','tr','ki']) h += chartCard(k);
  // Historique
  const tests = testsSorted().reverse();
  h += `<div class="sec-title"><h3>Mes résultats</h3><button class="btn sm primary" data-act="results" data-d="${t}">+ Ajouter</button></div>`;
  h += tests.length ? `<div class="card tight">${tests.map(x => `<div class="dayrow" data-act="edit-test" data-id="${x.id}" style="cursor:pointer"><div class="dt"><span>${MON[pd(x.date).getMonth()]}</span><b>${pd(x.date).getDate()}</b></div><div class="grow small"><b>LL</b> ${fmtVal('ll',x.ll)} · <b>Tr.</b> ${fmtVal('tr',x.tr)} · <b>Killy</b> ${fmtVal('ki',x.ki)}${x.note?`<div class="faint">${esc(x.note)}</div>`:''}</div>${ICON_CHEV}</div>`).join('')}</div>`
    : `<div class="card empty">Aucun résultat pour l'instant.<br>Fais l'évaluation de départ et saisis tes chiffres.</div>`;
  const nextTests = Object.entries(sp.test).filter(([d]) => d > t || (d === t && sessionStatus(d).st !== 'ok')).sort();
  if (nextTests.length) h += `<p class="faint small" style="text-align:center">Prochain test prévu : ${fmtDL(nextTests[0][0])}${sp.sim && sp.sim >= t ? ` · simulation complète le ${fmtD(sp.sim)}` : ''}</p>`;
  return h;
}
function chartCard(k){
  const T = S.train, G = T.goals, t = todayStr();
  const pts = testsSorted().filter(x => x[k] != null).map(x => [x.date, x[k]]);
  const W = 330, H = 170, L = 34, R = 10, Tp = 12, B = 22;
  const x0 = T.start, x1 = T.exam, span = Math.max(1, dd(x0, x1));
  const vals = pts.map(p => p[1]).concat([G[k], baseline(k) ?? DEF[k]]);
  let y0 = Math.min(...vals), y1 = Math.max(...vals);
  if (k === 'll'){ y0 = Math.max(0, Math.floor(y0) - 1); y1 = y0 + Math.ceil((Math.ceil(y1) + 1 - y0)/4)*4; }
  else if (k === 'tr'){ y0 = 0; y1 = Math.ceil((y1+3)/8)*8; }
  else { y0 = 0; y1 = Math.ceil((y1+20)/60)*60; }
  const X = s => L + (W-L-R) * clamp(dd(x0, s)/span, -0.02, 1.02);
  const Y = v => Tp + (H-Tp-B) * (1 - (v-y0)/Math.max(1e-6,(y1-y0)));
  let g = '';
  const steps = 4;
  for (let i=0;i<=steps;i++){ const v = y0 + (y1-y0)*i/steps; const y = Y(v); g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+3}" text-anchor="end">${k==='ki'?fmtClock(v):Math.round(v*10)/10}</text>`; }
  for (let i=0;i<=4;i++){ const s = addD(x0, Math.round(span*i/4)); g += `<text class="ax" x="${X(s)}" y="${H-6}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${fmtD(s)}</text>`; }
  // trajectoire attendue
  let ep = ''; for (let i=0;i<=24;i++){ const s = addD(x0, Math.round(span*i/24)); ep += `${i?'L':'M'}${X(s).toFixed(1)},${Y(expected(k,s)).toFixed(1)}`; }
  g += `<path class="expline" d="${ep}"/>`;
  g += `<line class="goalline" x1="${L}" x2="${W-R}" y1="${Y(G[k])}" y2="${Y(G[k])}"/><text class="ax" x="${W-R}" y="${Y(G[k])-5}" text-anchor="end" style="fill:var(--ok);font-weight:700">objectif ${fmtVal(k,G[k])}</text>`;
  if (t >= x0 && t <= x1) g += `<line class="today" x1="${X(t)}" x2="${X(t)}" y1="${Tp}" y2="${H-B}"/>`;
  if (pts.length){
    const d = pts.map((p,i) => `${i?'L':'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    if (pts.length > 1) g += `<path class="area" d="${d}L${X(pts[pts.length-1][0]).toFixed(1)},${H-B}L${X(pts[0][0]).toFixed(1)},${H-B}Z"/>`;
    g += `<path class="real" d="${d}"/>` + pts.map(p => `<circle class="pt" cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5"/>`).join('');
  }
  const cur = latest(k), base = baseline(k);
  const gain = cur != null && base != null ? cur - base : null;
  return `<div class="card"><div class="row"><b class="grow">${EP[k].name}</b>${cur!=null && pts.length===1?'<span class="tag">point de départ</span>':cur!=null?`<span class="tag ${gain>0?'ok':''}">${gain>0?'+':''}${k==='ll'?(Math.round(gain*4)/4).toString().replace('.',','):k==='ki'?Math.round(gain)+' s':Math.round(gain)} depuis le début</span>`:'<span class="tag">pas encore de test</span>'}</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>tes tests</span><span><i style="background:repeating-linear-gradient(90deg,var(--faint) 0 2px,transparent 2px 5px)"></i>progression prévue</span><span><i style="background:var(--ok)"></i>objectif</span></div></div>`;
}

function upsertTest(date, vals, note){

function llSchedule(fromPalier=1, maxPalier=21){
  const ev = []; let t = 0;
  for (let n = fromPalier; n <= maxPalier; n++){
    const v = P2V(n), dt = 72/v, cnt = llShuttles(n);
    for (let k = 1; k <= cnt; k++){ t += dt; ev.push({ t, n, k, cnt, last:k===cnt, v }); }
  }
  return ev;
}
function bipTool(){

        $('bp-go').after(sv);

      releaseWake(); return;
    }
    audio(); keepAwake();
    document.querySelectorAll('#ov-body .btn.ok').forEach(b => b.remove());
    if (mode === 'test'){
      const st = +($('bp-start')?.value || 1);

      for (let r=1;r<=reps;r++){
        ev.push({t, type:'go', label:`Répétition ${r}/${reps} — palier ${n}`, n, k:0});
        const cnt = Math.max(1, Math.round(wk/dt));
        for (let k=1;k<=cnt;k++){ t += dt; ev.push({t, n, k, cnt, last:false}); }
        if (r < reps){ ev.push({t:t+0.01, type:'rest', label:`Récup ${rs} s`}); t += rs; }
      }
      ev.push({t:t+0.02, type:'rest', label:'Terminé 👏'});

    idx = 0; t0 = performance.now(); running = true; $('bp-go').textContent = mode === 'test' ? 'Stop (je m\'arrête)' : 'Arrêter';
    $('bp-p').textContent = '—'; $('bp-n').textContent = '—'; $('bp-v').textContent = '—';
    raf = requestAnimationFrame(tick);
  };
}

function trainClick(e){

  if (b.dataset.sub){ S.ui.tsub = b.dataset.sub; save(); renderTrain(); window.scrollTo({top:0}); return; }
